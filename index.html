{t:"Reglas generales para todos los equipos de trabajo",ico:"⚙️",min:11,src:ER+" · «Riesgos derivados de los equipos de trabajo» (300 Otros)",
obj:["Conocer los requisitos generales que la evaluación fija para todos los equipos.","Saber qué hacer ante un equipo averiado.","Entender cuándo no deben usarse guantes."],
b:[["1. Requisitos del equipo",UL(["Marcado CE o adaptado según el RD 1215/1997; instalado y operado conforme al manual.","Manual de utilización y de mantenimiento a disposición, en el idioma del país, recomendándose guardarlo junto al equipo y certificar su entrega.","Inventario de equipos y registro de certificados, informes y revisiones.","Instrucción de seguridad para todos los equipos (normas de uso, prohibiciones y equipos de uso obligatorio), con registro de entrega.","Es recomendable registrar la firma del trabajador sobre los equipos que tiene autorizados (documento de autorización de equipos)."])],
["2. Antes, durante y después del uso",T(["Momento","Qué hacer"],[["Sin experiencia","Usar el equipo solo bajo presencia y supervisión de un trabajador experimentado hasta adquirir experiencia."],["Antes","Comprobar que está en perfecto estado, con todos los resguardos y dispositivos de seguridad y bien fijado; que su puesta en marcha no es un peligro para terceros."],["Durante","Usarlo para su finalidad, sin sobrepasar prestaciones ni límites; ropa ajustada, sin anillos ni cadenas, pelo recogido; acceso a la parada de emergencia libre."],["Anomalía","Comunicar de inmediato al superior, desconectar, señalizar «Averiado» y no usar hasta su reparación."],["Después","Desconectar de la alimentación al terminar."],["Nunca","Modificar equipos, repararlos sin capacitación o eliminar protecciones."]])],
["3. Mantenimiento y fuera de uso",UL(["Mantenimiento, ajuste, desbloqueo, limpieza o reparación con riesgo: con el equipo parado o desconectado, sin energías residuales y evitando la puesta en marcha accidental; solo por personal capacitado y autorizado.","Las protecciones retiradas se reponen inmediatamente.","Equipo fuera de uso: retirarlo o señalizarlo «FUERA DE USO» y dejarlo no operativo.","Equipos de uso exclusivo del empresario: señalizarlos e impedir su uso."])],
["4. Guantes y partes móviles",ALERT("La evaluación indica que, cuando el equipo tiene una <b>parte móvil peligrosa accesible</b> que pueda generar corte o atrapamiento, debe especificarse la <b>prohibición de usar guantes</b>, ya que el guante obstaculiza la retirada de la extremidad (cita la NTP 1173). En tu puesto: evitar guantes cuando puedan ser arrastrados por mecanismos móviles (riesgo 110).")],
["5. Colores de los mandos",T(["Función","Color"],[["Puesta en marcha / en tensión","Blanco"],["Parada / fuera de tensión","Negro"],["Parada de emergencia","Rojo (sobre fondo amarillo)"],["Supresión de condiciones anormales","Amarillo"],["Rearme","Azul"]])],
["6. Caso práctico",CASO("La AirBike hace un ruido raro","En mitad de la sesión la AirBike empieza a hacer un ruido metálico y a calentarse.","Detener su uso, comunicarlo de inmediato al superior, desconectarla si procede, señalizar «Averiado» y no usarla hasta que esté reparada.")]],
key:"Equipo con marcado CE, manual a mano, revisión antes de usar, protecciones siempre puestas y, ante cualquier anomalía: parar, señalizar «Averiado» y comunicar.",
q:[["Ante una anomalía en un equipo:",["Seguir usándolo","Comunicarlo, desconectar, señalizar «Averiado» y no usarlo hasta su reparación","Repararlo tú","Esconderlo"],1],
["Un trabajador sin experiencia en un equipo:",["Puede usarlo libremente","Lo usa bajo supervisión de alguien experimentado hasta adquirir experiencia","No puede trabajar nunca","Lo usa solo de noche"],1],
["Color de la parada de emergencia:",["Verde","Rojo sobre fondo amarillo","Azul","Blanco"],1],
["Con partes móviles accesibles que puedan atrapar:",["Usar siempre guantes","Puede prohibirse el uso de guantes","Guantes de lana","Da igual"],1],
["Las protecciones retiradas en un mantenimiento:",["Se reponen inmediatamente al acabar","Se guardan","Se tiran","Se reponen al mes"],0],
["El manual de los equipos debe estar:",["En el almacén cerrado","A disposición, en el idioma del país, mejor junto al equipo","Solo en la web","Nunca accesible"],1]]},
{t:"Reformer-Cadillac: uso, ajustes y riesgos",ico:"🛏️",min:14,src:ER+" · Equipo «Cadillac Reformer de Elina Pilates»",
obj:["Conocer los componentes del Reformer-Cadillac.","Aplicar las medidas para cada uno de sus 10 riesgos.","Preparar y verificar el equipo antes de cada sesión."],
b:[["1. El equipo",`<p>Combina un reformer de carro deslizante con una estructura superior tipo Cadillac, de madera de arce con elementos de acero inoxidable y aluminio. Dispone de <b>muelles</b> de distintas resistencias, <b>cuerdas, poleas, barra de pies regulable</b>, barras de ajuste horizontal y vertical, <b>barra de estiramientos con cincha de seguridad</b>, trapecio, barra roll-down y accesorios.</p>${T(["Nº","Riesgo del equipo","Valoración"],[["260","Carga física: postura",V("Tolerable")],["020","Caída al mismo nivel",V("Tolerable")],["010","Caída de personas a distinto nivel",V("Tolerable")],["080","Choques contra objetos móviles",V("Tolerable")],["070","Choques contra elementos inmóviles",V("Tolerable")],["110","Atrapamientos",V("Tolerable")],["090","Golpes o cortes",V("Tolerable")],["030","Caída de objetos por desplome",V("Tolerable")],["162","Exposición a sustancias químicas",V("Tolerable")],["300","Otros",V("Tolerable")]])}`],
["2. Caída a distinto nivel",RK("010","Caída de personas a distinto nivel","Tolerable",[1,2])+UL(["Acceder y descender de la plataforma de forma controlada, con el carro estabilizado y usando los apoyos previstos.","Antes de las demostraciones, comprobar configuración, resistencia y estabilidad de los accesorios.","Ejercicios elevados, de suspensión o invertidos: solo si están previstos para el equipo, con personal específicamente formado y asistencia.","<b>No utilizar la estructura como escalera</b>.","No exponer a trabajadoras embarazadas a trabajos en altura."])],
["3. Atrapamientos, golpes y cortes",UL(["No introducir manos, pies, ropa u objetos entre el carro y el bastidor, en poleas, muelles y articulaciones.","Ajustes con el movimiento detenido y los elementos asegurados; cabello recogido, sin prendas holgadas ni colgantes; protecciones originales colocadas.","Antes del uso, revisar muelles, ganchos, mosquetones, cuerdas y puntos de conexión; retirar los que tengan deformaciones, corrosión, desgaste, deshilachados o cierres defectuosos.","<b>No enganchar ni desenganchar elementos bajo tensión</b> y no situar la cara o el cuerpo en su trayectoria de retroceso.","Usar recambios autorizados por el fabricante; revisar madera (astillas), metal (rebabas), agarres y mecanismos.","Accesorios por sus zonas de agarre, manos secas, sin forzar ni usar herramientas improvisadas."])],
["4. Postura y desplazamiento del equipo",UL(["Preparar los accesorios cerca de su lugar de uso, con agarre firme, próximos al cuerpo y sin giros del tronco.","Pedir ayuda para elementos voluminosos.","<b>No trasladar el equipo completo de forma individual ni arrastrarlo por barras, cuerdas o elementos móviles</b>; planificar el desplazamiento con medios adecuados según el fabricante.","Evitar flexiones mantenidas, alcances excesivos y brazos elevados prolongados; alternar posiciones; demostraciones limitadas a lo necesario.","<b>No intentar detener con un esfuerzo brusco</b> el movimiento descontrolado de una persona o del equipo."])],
["5. Limpieza y organización",UL(["Limpiar apoyos, tapizados y agarres con productos compatibles; <b>no pulverizar directamente sobre poleas, guías o mecanismos</b>; dejar las superficies secas y sin residuos deslizantes; higiene de manos.","Manual específico disponible; formación en ajustes, selección de resistencias, bloqueos y dispositivos de seguridad.","<b>Verificar la configuración antes de cada sesión</b> y explicar a las usuarias las pautas de uso seguro.","Programa documentado de revisión y sustitución de componentes según fabricante e intensidad de uso.","Identificar e inmovilizar equipos defectuosos hasta su reparación, sin modificaciones estructurales."])],
["6. Checklist antes de la sesión",FLOW(["Entorno despejado","Muelles, ganchos, cuerdas OK","Pasadores y bloqueos acoplados","Cincha de la barra ajustada","Superficies secas","Pautas a la usuaria"])],
["7. Casos prácticos",CASO("Cambiar el muelle con tensión","Para ganar tiempo, cambias un muelle mientras la usuaria mantiene el carro desplazado.","No se deben enganchar ni desenganchar elementos bajo tensión: detener el ejercicio, asegurar el carro y realizar el ajuste con el movimiento detenido, fuera de la trayectoria de retroceso.")+CASO("Mover el Cadillac sola","Hay que desplazar el Cadillac un metro y lo intentas tirando de la barra superior.","La evaluación prohíbe trasladar el equipo completo de forma individual o arrastrarlo por barras, cuerdas o elementos móviles. Planificar el desplazamiento con medios adecuados y según el fabricante.")+CASO("Cuerda deshilachada","Ves que una de las cuerdas de las poleas está deshilachada.","Retirar del servicio el elemento, usar recambios autorizados por el fabricante e inmovilizar/identificar el equipo si no puede usarse con seguridad; comunicar la incidencia.")]],
key:"Antes de cada sesión, verifica la configuración; nunca ajustes con tensión o movimiento, no uses la estructura como escalera, no lo muevas sola y retira cualquier pieza deteriorada.",
q:[["Enganchar un muelle bajo tensión:",["Es correcto","No debe hacerse","Es más rápido y seguro","Solo con guantes"],1],
["La estructura del Cadillac como escalera:",["Se puede usar","No debe usarse como escalera","Solo para limpiar arriba","Solo con calzado"],1],
["Para limpiar el Reformer:",["Pulverizar sobre poleas y guías","Productos compatibles, sin pulverizar sobre mecanismos, dejando secar","Agua a presión","Lejía pura"],1],
["¿Cuándo se verifica la configuración del equipo?",["Una vez al año","Antes de cada sesión","Nunca","Solo si falla"],1],
["Para desplazar el equipo:",["Arrastrarlo por la barra","Planificar con medios adecuados según el fabricante, no de forma individual","Tirar de las cuerdas","Empujar el carro"],1],
["Un mosquetón con el cierre defectuoso:",["Se usa igual","Se retira del servicio","Se ata con cuerda","Se aprieta con alicates"],1],
["Ejercicios invertidos o en suspensión:",["Libres","Solo si están previstos para el equipo, con personal formado y asistencia","Prohibidos siempre","Solo con música"],1]]},
{t:"Material de gimnasio: pesas, barras, TRX, remo, AirBike y steps",ico:"🏋️‍♀️",min:12,src:ER+" · Equipo «Material y equipos auxiliares de entrenamiento de gimnasio»",
obj:["Conocer los 12 riesgos evaluados en el material de gimnasio.","Montar barras y discos de forma segura.","Aplicar las comprobaciones previas y el mantenimiento documentado."],
b:[["1. Qué abarca",`<p>Pesas y mancuernas, barras y discos, bancos, máquina de remo, sistema de suspensión tipo TRX, plataformas de step y cajones. La evaluación contempla su uso por el personal en <b>demostraciones, preparación, supervisión, recogida y limpieza</b>.</p>${T(["Nº","Riesgo","Valoración"],[["260","Postura",V("Tolerable")],["020","Caída al mismo nivel",V("Tolerable")],["040","Caída de objetos en manipulación",V("Tolerable")],["070","Choques contra elementos inmóviles",V("Tolerable")],["090","Golpes o cortes",V("Tolerable")],["110","Atrapamientos",V("Tolerable")],["162","Sustancias químicas",V("Tolerable")],["262","Sobresfuerzos",V("Tolerable")],["300","Otros",V("Tolerable")],["080","Choques contra objetos móviles",V("Tolerable")],["050","Caída de objetos desprendidos",V("Tolerable")],["263","Manipulación manual de cargas",V("Tolerable")]])}`],
["2. Barras, discos y cierres",UL(["Usar barras, discos y cierres <b>compatibles</b>, con los sistemas de retención previstos y comprobando su fijación antes del ejercicio.","Cargar y descargar las barras de forma <b>controlada y equilibrada</b>, evitando que basculen o se desplacen sobre sus soportes.","No superar la capacidad del conjunto ni usar cierres deteriorados o improvisados."])],
["3. Remo, AirBike y bancos",UL(["Manos, pies, cabello y ropa alejados de transmisiones, asientos móviles, articulaciones y mecanismos de regulación.","Conservar los resguardos originales y ajustar con el equipo detenido.","Comprobar que los pasadores están completamente introducidos y los bloqueos fijados; no intervenir en mecanismos durante el ejercicio.","Regular bancos, asientos, apoyos y correas antes del uso."])],
["4. Sobresfuerzos en demostraciones y asistencia",UL(["Cargas, resistencias y alturas adecuadas a la capacidad del personal; repeticiones limitadas a las necesarias para explicar.","Alternar demostraciones y supervisión, evitando acumular esfuerzos intensos entre sesiones.","<b>Planificar previamente cualquier asistencia</b> en ejercicios con cargas, sin improvisar maniobras para sujetar pesos que excedan la capacidad del personal."])],
["5. Organización y mantenimiento",UL(["Instrucciones de los equipos disponibles y formación sobre utilización, ajustes y límites de carga.","<b>Comprobaciones visuales antes de las sesiones</b> y mantenimiento documentado según fabricante e intensidad de uso.","Retirar e identificar el material defectuoso hasta su reparación o sustitución.","No modificar estructuras, retirar protecciones ni incorporar accesorios incompatibles.","Trasladar bancos y máquinas con los sistemas de transporte previstos, sin levantarlos por piezas móviles.","Limpiar empuñaduras, apoyos, bancos y colchonetas con productos compatibles, dejar secar y no pulverizar sobre transmisiones, rodamientos o componentes eléctricos."])],
["6. Casos prácticos",CASO("Cierre de barra perdido","Falta un cierre para la barra y se propone sujetar los discos con una cinta elástica.","No usar cierres deteriorados o improvisados; utilizar los sistemas de retención previstos y compatibles y comprobar su fijación.")+CASO("Asistencia improvisada","Una usuaria se queda bloqueada en un press de banca y el técnico, sin haberlo previsto, intenta levantar la barra él solo desde un lateral.","La evaluación pide planificar previamente cualquier asistencia en ejercicios con cargas y no improvisar maniobras para sujetar pesos que excedan la capacidad del personal.")]],
key:"Cierres compatibles y fijados, carga y descarga equilibrada, ajustes con el equipo parado, comprobación visual antes de cada sesión y asistencia siempre planificada.",
q:[["Para fijar los discos en la barra:",["Una cinta elástica","Cierres compatibles y previstos, comprobando su fijación","Nada","Cinta americana"],1],
["La carga de una barra en el soporte debe ser:",["Rápida por un lado","Controlada y equilibrada","Desde arriba dejándola caer","Indiferente"],1],
["La asistencia en ejercicios con cargas:",["Se improvisa","Se planifica previamente","Está prohibida siempre","La hace otra usuaria"],1],
["Antes de cada sesión con el material:",["Comprobación visual","Nada","Revisión anual","Pintarlo"],0],
["Un banco se traslada:",["Por el asiento móvil","Con los sistemas de transporte previstos","Arrastrándolo por las patas","Por el respaldo regulable"],1],
["En el remo, durante el ejercicio:",["Ajustar el asiento","No intervenir en los mecanismos","Engrasar la cadena","Cambiar la resistencia con la mano en la transmisión"],1]]},
{t:"Golpes, cortes y atrapamientos",ico:"✋",min:10,src:ER+" · riesgos 090 y 110 (puesto y equipos)",
obj:["Detectar defectos que causan cortes y pinchazos.","Evitar atrapamientos en poleas, carros y transmisiones.","Elegir bien la ropa y los complementos."],
b:[["1. Golpes o cortes (090)",RK("090","Golpes o cortes con objetos o herramientas","Tolerable",[1,2])+UL(["Usar equipos y materiales conforme a su finalidad y al fabricante, evitando usos improvisados.","Comprobar que barras, discos, mancuernas, mosquetones y elementos de ajuste no tengan bordes cortantes, rebabas, roturas o piezas deterioradas.","Retirar el material defectuoso y comunicar la incidencia.","Ajustes con el equipo detenido y con los mecanismos previstos, sin forzar piezas ni usar herramientas improvisadas.","Cuando una tarea concreta lo requiera, <b>guantes de protección adecuados</b> que permitan un agarre seguro."])],
["2. Atrapamientos (110)",RK("110","Atrapamientos por o entre objetos","Tolerable",[1,2])+UL(["Partes móviles del Reformer-Cadillac, remo, AirBike y demás en buen estado, con resguardos y protecciones del fabricante colocados.","No introducir manos, pies u objetos entre el carro móvil y el bastidor, en poleas, transmisiones y otros puntos de atrapamiento.","Ajustar muelles, correas, barras y asientos con el equipo detenido y asegurado, evitando movimientos o retornos inesperados.","En demostraciones y correcciones, detener el ejercicio antes de intervenir.","<b>Ropa ajustada, cabello largo recogido, sin anillos, pulseras ni colgantes</b>; sin guantes cuando puedan ser arrastrados por mecanismos móviles.","Respetar la señalización y retirar del uso equipos con protecciones ausentes o deterioradas."])],
["3. Conocer el equipo",`<p>La evaluación añade que el personal debe <b>conocer y cumplir las instrucciones de uso, ajuste y mantenimiento</b>, respetar señalización, límites de carga y condiciones; mantener los manuales accesibles; usar cada equipo solo para lo previsto, sin modificaciones; disponer de formación e información y <b>abstenerse de usar un equipo cuando desconozca su funcionamiento</b>. Antes de las sesiones, explicar a las usuarias las indicaciones de uso seguro y supervisar su cumplimiento.</p>`],
["4. Resguardos según la evaluación",OL(["De fabricación sólida y resistente.","No ocasionan riesgos suplementarios.","No es fácil anularlos.","A suficiente distancia de la zona peligrosa.","No limitan más de lo imprescindible la observación.","Permiten las intervenciones indispensables sin desmontarlos, a ser posible."])+`<p>Las correas de transmisión deben quedar protegidas por un resguardo fijo que impida el acceso de los dedos.</p>`],
["5. Caso práctico",CASO("Pulseras y anillos","Una técnica da una clase de Reformer con varias pulseras y el pelo suelto largo.","La evaluación pide ropa ajustada, cabello largo recogido y evitar anillos, pulseras, colgantes u otros elementos que puedan engancharse en poleas, muelles y articulaciones.")]],
key:"Revisa que no haya rebabas ni roturas, ajusta siempre con el equipo parado, manos fuera de carros y poleas, pelo recogido y sin joyas.",
q:[["Para evitar atrapamientos en el Reformer:",["Llevar pulseras","Cabello recogido, ropa ajustada y sin joyas","Guantes holgados","Bufanda"],1],
["Si desconoces el funcionamiento de un equipo:",["Lo pruebas","Te abstienes de usarlo","Le preguntas a una usuaria","Lo desmontas"],1],
["Un disco con rebabas:",["Se usa","Se retira y se comunica la incidencia","Se lija tú misma","Se da a usuarias expertas"],1],
["Los ajustes de muelles y correas se hacen:",["En movimiento","Con el equipo detenido y asegurado","Con herramienta improvisada","Mientras la usuaria empuja"],1],
["Una característica de los resguardos según la evaluación:",["Fáciles de anular","No ocasionan riesgos suplementarios","De papel","Pegados con cinta"],1]]},
{t:"Vuelco y estabilidad de racks, bancos y estructuras",ico:"🏗️",min:8,src:ER+" · riesgo 120",
obj:["Comprobar la estabilidad de los equipos.","Saber cuándo retirar un equipo por inestabilidad."],
b:[["1. El riesgo",RK("120","Atrapamiento por vuelco de máquinas o equipos","Tolerable",[1,2])+`<p>Especialmente racks, bancos, máquinas de Pilates y estructuras de entrenamiento en suspensión.</p>`],
["2. Medidas",UL(["Garantizar la estabilidad de los equipos durante su utilización.","Instalar y mantener los anclajes que requiera cada equipo según el fabricante, fijados a elementos resistentes y adecuados para las cargas y esfuerzos.","<b>Comprobar periódicamente</b> fijaciones, apoyos y sistemas de bloqueo.","Retirar del uso cualquier equipo con holguras, desplazamientos o inestabilidad.","Evitar cargas o esfuerzos no previstos que puedan provocar vuelco o desplazamiento."])],
["3. Tabla de comprobación",T(["Qué mirar","Señal de alarma","Actuación"],[["Anclajes del rack/estructura de pared","Tornillos sueltos, holgura","Retirar del uso y comunicar"],["Apoyos del banco","Cojea, se desplaza","Retirar del uso y comunicar"],["Bloqueos y pasadores","No encajan del todo","No usar hasta corregir"],["Superficie","Desnivelada","Recolocar sobre superficie estable y nivelada"]])],
["4. Caso práctico",CASO("Rack que se mueve","Al apoyar la barra cargada en el rack anclado a la pared notas que toda la estructura se desplaza ligeramente.","Retirar del uso el rack por holguras o desplazamientos, comunicar la incidencia y no volver a usarlo hasta revisar sus anclajes según el fabricante.")]],
key:"Un equipo que se mueve, cojea o tiene holguras se retira del uso hasta revisar sus anclajes.",
q:[["Equipos con especial atención al vuelco:",["Colchonetas","Racks, bancos, máquinas de Pilates y estructuras en suspensión","Pelotas","Toallas"],1],
["Ante un equipo con holguras:",["Seguir con menos carga","Retirarlo del uso","Ponerle un calzo de cartón","Avisar el mes que viene"],1],
["Los anclajes se fijan a:",["Cualquier pared","Elementos resistentes adecuados a las cargas, según fabricante","Tuberías","Mobiliario"],1],
["Las fijaciones y bloqueos se comprueban:",["Nunca","Periódicamente","Solo al comprar","Cada 10 años"],1]]},
{t:"Aspiradora, lavadora y equipos informáticos",ico:"💻",min:10,src:ER+" · Equipos «Aspiradora», «Lavadora», «Equipos informáticos»",
obj:["Usar con seguridad aspiradora y lavadora.","Aplicar las medidas de pantallas de visualización (PVD) en la planificación."],
b:[["1. Aspiradora",T(["Riesgo","Medidas"],[["151 Contactos eléctricos indirectos "+V("Tolerable"),"Comprobar cable y clavija; rechazar cables en mal estado, con empalmes o cinta aislante (sustituir, no reparar); comprobar la potencia. Prohibido anular la toma de tierra, romper el doble aislamiento o usarla sin carcasa."],["260 Postura "+V("Tolerable"),"Evitar flexión de espalda y giros; para trabajos bajo la cintura, flexionar rodillas sin encorvar la espalda; alternar posturas y pausas."]])],
["2. Lavadora",T(["Riesgo","Medidas"],[["110 Atrapamientos "+V("Tolerable"),"Revisar estado y dispositivos de seguridad antes de usarla; comunicar anomalías y no usarla hasta su reparación; usarla según el fabricante sin sobrecargarla; no modificarla."],["140 Contactos térmicos "+V("Tolerable"),"Presumir que está caliente hasta comprobarlo; esperar a que se enfríe; respetar la señalización; no introducir las manos en zonas calientes."]])],
["3. Equipos informáticos (planificación)",T(["Riesgo","Medidas"],[["251 Fatiga visual "+V("Tolerable"),"Pantalla perpendicular a las ventanas; evitar deslumbramientos y reflejos; luz lateral; alternar tareas o pausas de 5-10 min cada hora o 15 min cada 2 h en trabajo permanente con alta concentración; ejercicios de relajación visual."],["260 Postura "+V("Tolerable"),"Teclado independiente con 10 cm de apoyo; borde superior de la pantalla a la altura de los ojos como máximo; zona visual óptima entre la horizontal y 30° por debajo; silla regulada con espalda recta; pantalla y teclado frontales; ratón con apoyo y muñeca recta."],["150/151 Eléctricos "+V("Tolerable"),"No manipular con manos mojadas; no tirar del cable; no abusar de alargadores ni «ladrones»; no dejar equipos conectados al final de la jornada; reparar solo por personal especializado."]])+NOTE("En tu puesto (riesgo 260) la evaluación pide, para la planificación con ordenador, una superficie y un asiento adecuados que permitan apoyar la espalda y los pies.")],
["4. Caso práctico",CASO("Planificando en el sofá de recepción","Un técnico prepara durante una hora los programas con el portátil sobre las rodillas en el sofá.","La evaluación pide para estas tareas una superficie y un asiento adecuados, apoyo de espalda y pies, pantalla frontal con el borde superior a la altura de los ojos como máximo y pausas o alternancia de tareas.")]],
key:"Aspiradora: cable y clavija en buen estado. Lavadora: presume que está caliente. Ordenador: mesa y silla adecuadas, pantalla bien situada y pausas.",
q:[["Un cable de aspiradora reparado con cinta aislante:",["Aceptable","Debe rechazarse: sustituir el cable, no repararlo","Mejora el aislamiento","Solo si es negra"],1],
["Con la lavadora recién usada:",["Meter la mano en el tambor","Presumir que está caliente hasta comprobarlo","Tocar la puerta de vidrio","Nada"],1],
["El borde superior de la pantalla debe quedar:",["Por encima de la cabeza","A la altura de los ojos como máximo","En el suelo","Indiferente"],1],
["Pausas en trabajo permanente con PVD de alta concentración:",["5-10 min cada hora o 15 min cada 2 h","Nunca","1 h cada 10 min","Solo al acabar"],0],
["La ventana respecto a la pantalla:",["Justo detrás de la pantalla","Perpendicular, ni detrás de la pantalla ni del trabajador","Detrás del trabajador","Indiferente"],1]]}
]};

b:[["1. El riesgo",RK("150","Contactos eléctricos directos (puesto)","Tolerable",[1,2])+RK("150","Contactos eléctricos directos (instalación eléctrica y equipos de trabajo)","Moderado")+`<p>Equipos implicados: ordenadores, equipos de música, aspiradores, lavadora y cualquier aparato conectado.</p>`],
["2. Uso de los equipos",UL(["Manos secas y lejos de zonas mojadas.","Desconectar sujetando la clavija, <b>sin tirar del cable</b>.","Evitar alargadores como instalación permanente, conexiones en cascada y adaptadores tipo «ladrón»; no conectar cables sin clavija ni sobrecargar las tomas.","Cables alejados del agua, del calor y de partes móviles, sin aplastarlos.","Revisar visualmente cables, clavijas y enchufes; si hay daños o partes conductoras accesibles, dejar de usarlos y comunicarlo.","Equipos cuyos sistemas de protección sean compatibles con la instalación; mantener la toma de tierra y no anular protecciones.","No usar, hasta que los revise un especialista, equipos que hayan sufrido un golpe fuerte o humedad."])],
["3. Lo que hace la empresa (no tú)",T(["Medida de la evaluación","Quién"],[["Mantenimiento de la instalación según fabricantes e instaladores","Empresa"],["Comprobación de la puesta a tierra al menos anual (época más seca), con registro (ITC-BT-18 del REBT)","Personal técnicamente competente / instalador autorizado"],["Prueba de los interruptores diferenciales con el pulsador (periodicidad del fabricante; en la instalación se indica 1 vez al mes)","Programa de mantenimiento; si fallan, empresa instaladora habilitada"],["Comprobar si la instalación está sujeta a inspección reglamentaria (RD 842/2002)","Empresa"],["Proteger/tapar cuadros y señalizar el riesgo eléctrico (RD 485/1997)","Empresa"]])+ALERT("«El personal técnico de actividades físicas y entrenamiento <b>no realizará reparaciones ni modificaciones</b> de la instalación eléctrica.» Tampoco debe manipular el cuadro ni forzar el rearme de magnetotérmicos o diferenciales.")],
["4. Caso práctico",CASO("Salta el diferencial","Durante la clase se va la luz de la sala y la música. Una compañera propone subir el diferencial una y otra vez hasta que aguante.","No manipular el cuadro ni forzar el rearme de magnetotérmicos o diferenciales. Comunicar la incidencia; si los diferenciales no actúan correctamente, debe intervenir una empresa instaladora habilitada.")]],

q:[["Para desenchufar un equipo:",["Tirar del cable","Sujetar la clavija","Usar el pie","Tirar del alargador"],1],

{t:"Riesgo eléctrico: contactos indirectos y limpieza",ico:"🔌",min:9,src:ER+" · riesgo 151",
obj:["Detectar señales de un defecto eléctrico.","Evitar salpicaduras sobre equipos durante la limpieza."],
b:[["1. El riesgo",RK("151","Contactos eléctricos indirectos","Tolerable",[1,2])+`<p>En la evaluación de los equipos de trabajo se valora como Moderado.</p>`],
["2. Señales de alarma",T(["Señal","Actuación"],[["Daños en cables, clavijas o carcasas","Suspender el uso y comunicar"],["Calentamiento anormal","Suspender el uso, desconectar si puede hacerse con seguridad y comunicar"],["Sensación de descarga al tocarlo","Suspender el uso, desconectar si es seguro y comunicar para revisión por personal cualificado"],["Chispazos o cortes de suministro","No tocar la instalación, desconectar si es seguro e informar a la empresa"]])],
["3. Prohibiciones",UL(["Conexiones con cables desnudos o pelados en las tomas.","Reparaciones improvisadas con cinta aislante o regletas.","Abrir carcasas o manipular componentes internos; usar solo los mandos previstos.","Anular la puesta a tierra, los aislamientos u otros dispositivos de protección.","Sobrecargar bases múltiples (respetar su potencia máxima); conectar equipos con toma de tierra a tomas o alargadores sin ella.","Dejar los alargadores de tambor enrollados (desenrollarlos según el fabricante para evitar sobrecalentamientos)."])],
["4. Limpieza y zonas húmedas",UL(["Evitar salpicaduras sobre enchufes y aparatos al limpiar y desinfectar salas y material.","No manipular equipos conectados con manos o pies mojados.","No usar ni guardar aparatos en zonas húmedas si no están diseñados para ello.","Respetar la señalización de riesgo eléctrico; cuadros cerrados y accesos despejados.","Comunicar la necesidad de nuevos puntos de conexión para evitar instalaciones provisionales."])],
["5. Caso práctico",CASO("Desinfección junto al altavoz","Pulverizas desinfectante sobre el banco que está justo al lado de la regleta del equipo de música.","Evitar salpicaduras sobre enchufes y aparatos; no pulverizar sobre componentes eléctricos. Mover el banco o aplicar el producto sobre una bayeta.")]],
key:"Si un equipo calienta, chispea o da calambre: deja de usarlo, desconéctalo solo si es seguro y comunícalo. Nada de cinta aislante ni cables pelados.",

["Durante la limpieza:",["Pulverizar sobre enchufes","Evitar salpicaduras sobre enchufes y aparatos","Limpiar los cuadros por dentro","Mojar la regleta"],1],

{t:"Productos de limpieza y desinfección",ico:"🧴",min:13,src:ER+" · riesgos 160, 161 y 162 · apartado 6 (preparados químicos)",
obj:["Conocer los productos identificados y sus peligros.","Aplicar las medidas generales con productos químicos.","Usar los EPI indicados."],
b:[["1. Los riesgos",RK("161","Exposición a sustancias químicas por contacto (puesto)","Tolerable",[1,2])+RK("160","Exposición por inhalación (lugar de trabajo)","Tolerable",[1,2])+RK("162","Exposición a sustancias químicas (Reformer y material)","Tolerable",[1,2])],
["2. Los productos de tu puesto",T(["Producto","Peligros / clasificación","EPI de la evaluación"],[["<b>Alcohol isopropílico</b> (disolvente)","H225 líquido y vapores muy inflamables · H319 irritación ocular grave · H336 somnolencia o vértigo","Gafas de protección química (UNE-EN 166) · guante de nitrilo >0,4 mm (EN 374) · máscara con filtro A2 según FDS (UNE-EN 14387/143)"],["<b>Sanytol multisuperficies desinfectante</b>","No clasificado (CLP). No ingerir. Biocida: 0,5 % cloruro de didecildimetilamonio","No requiere protección ocular ni respiratoria. Se recomiendan guantes."]])+T(["Consejo de prudencia (alcohol isopropílico)","Significado"],[["P210","Alejar de calor, chispas, llama, superficies calientes. No fumar."],["P243","Precauciones contra descargas electrostáticas."],["P280","Guantes/prendas/gafas/máscara de protección."],["P303+P361+P353","Contacto con piel: quitar prendas contaminadas y aclarar con agua."],["P305+P351+P338+P310","Contacto con ojos: enjuagar varios minutos, quitar lentillas, llamar a toxicología o médico."],["P304+P340+P312","Inhalación: llevar al aire libre en posición cómoda; llamar a toxicología."],["P337+P313","Si persiste la irritación ocular: consultar a un médico."]])],
["3. Medidas generales",UL(["Conocer y cumplir el <b>etiquetado y la ficha de datos de seguridad (FDS)</b> antes de usar el producto.","No comer, beber ni fumar durante su uso.","<b>No mezclar productos</b> si no está indicado: pueden formar atmósferas tóxicas.","Usar las concentraciones del fabricante y mezclar en lugar ventilado.","Envases cerrados y etiquetados; <b>no trasvasar a envases de uso alimentario</b> ni reutilizar envases.","Almacenar en lugar apartado y cerrado; especial atención a los inflamables y no dejarlos junto a enchufes.","Evitar nubes o salpicaduras al extraer del envase.","Ante irritación o anomalía, acudir a la Unidad de Salud Laboral con la etiqueta."])],
["4. Lo que debe facilitar la empresa",UL(["Solicitar las FDS a los proveedores y mantener un registro actualizado; si no requieren FDS, etiquetado e instrucciones de uso seguro.","Información accesible cerca del almacenamiento o con consulta inmediata: peligros, diluciones, incompatibilidades, protección y actuación ante salpicaduras o derrames.","Valorar la sustitución por productos de menor peligrosidad.","EPI: <b>guantes según la FDS (UNE-EN 374-1/2/3)</b>."])],
["5. Limpieza de equipos",UL(["Productos compatibles con los materiales (tapizados, madera, agarres).","No pulverizar sobre poleas, guías, transmisiones, rodamientos o componentes eléctricos.","Dejar secar las superficies y sin residuos deslizantes antes de usarlas.","Higiene de manos."])],
["6. Casos prácticos",CASO("Botella de agua reutilizada","Para comodidad, una compañera ha rellenado una botella de agua vacía con alcohol isopropílico.","Prohibido trasvasar productos químicos a envases de uso alimentario; los productos deben estar en su envase original, cerrado y etiquetado.")+CASO("Desinfectar más fuerte","Se propone mezclar el Sanytol con otro producto para «potenciar» la desinfección.","No mezclar productos si no está indicado por el fabricante: pueden reaccionar y crear atmósferas tóxicas o nocivas.")]],
key:"Lee la etiqueta y la FDS, no mezcles, no trasvases a botellas de bebida, usa los guantes indicados y el alcohol isopropílico lejos de calor y chispas.",
q:[["El alcohol isopropílico es:",["No peligroso","Líquido y vapores muy inflamables (H225) e irritante ocular (H319)","Un alimento","Solo tóxico para plantas"],1],
["¿Puede trasvasarse a una botella de agua?",["Sí","No, nunca a envases de uso alimentario","Solo si se etiqueta a mano","Solo un rato"],1],
["Mezclar productos de limpieza:",["Siempre mejora","Solo si lo indica el fabricante","Obligatorio","Indiferente"],1],
["EPI de mano asignado al puesto frente a químicos:",["Guantes según la FDS (UNE-EN 374)","Guantes de lana","Ninguno","Guantes de boxeo"],0],
["El Sanytol multisuperficies según la evaluación:",["Muy inflamable","No clasificado; se recomiendan guantes","Requiere máscara A2","Corrosivo"],1],
["Ante salpicadura en los ojos con alcohol isopropílico:",["Frotar","Enjuagar con agua varios minutos, quitar lentillas y llamar a toxicología o médico","Nada","Aplicar crema"],1],

{t:"Agentes biológicos, higiene y enfermedades infecciosas",ico:"🦠",min:12,src:ER+" · riesgo 210 (puesto: Tolerable; lugar: Trivial) · legionela",
obj:["Aplicar la limpieza y desinfección del material compartido.","Actuar ante sangre, vómitos u otros fluidos.","Conocer las medidas frente a infecciones respiratorias y la ventilación."],
b:[["1. El riesgo",RK("210","Exposición a agentes biológicos (puesto)","Tolerable",[1,2])+`<p>Material de uso compartido (colchonetas, empuñaduras, correas, apoyos de Pilates), contacto con usuarias, secreciones y fluidos corporales, ventilación.</p>`],
["2. Limpieza y higiene",UL(["Limpieza y desinfección periódica de superficies y materiales compartidos, sobre todo colchonetas, empuñaduras, correas y apoyos.","Respetar diluciones y <b>tiempos de contacto</b> del fabricante; limpiar entre usos cuando sea necesario y <b>dejar secar</b>.","Renovación del aire y mantenimiento de la ventilación.","Higiene de manos, sobre todo tras limpiar, manipular residuos o contactar con secreciones.","Cubrir cortes o heridas con <b>apósitos impermeables</b>.","No compartir toallas; higiene respiratoria."])],
["3. Sangre, vómitos u otros fluidos",FLOW(["Delimitar la zona","Evitar contacto directo","Guantes desechables (+ protección ocular/facial si hay salpicaduras)","Retirar residuos de forma segura","Limpiar y desinfectar","Quitar guantes y lavar manos","Comunicar la exposición"])+NOTE("La retirada la realizará personal informado sobre el procedimiento. Cualquier exposición accidental se comunica para su valoración y seguimiento.")],
["4. Enfermedades infecciosas (lugar de trabajo)",UL(["Ante síntomas: seguir recomendaciones sanitarias, pedir valoración médica cuando corresponda y comunicar lo necesario preservando la confidencialidad (Vigilancia de la Salud).","Si hay casos, consultar con el Servicio de Prevención: ajustes de sesiones, menos contactos próximos, accesos escalonados.","<b>Las correcciones mediante contacto físico se limitarán</b> cuando exista riesgo de transmisión.","Agua y jabón (y solución hidroalcohólica como complemento); papeleras para residuos de higiene.","Mascarilla cuando esté indicada; FFP2 adecuada si se requiere protección respiratoria al atender usuarias, con instrucciones de colocación y retirada; la mascarilla no sustituye al resto de medidas.","Ventilación: CO₂ por encima de 800-1000 ppm indica ventilación deficiente; preferente natural; si no basta, filtración (p. ej. HEPA); no se recomienda la recirculación."])],
["5. Legionela (instalaciones)",`<p>El titular de las instalaciones del Anexo I del RD 487/2022 debe gestionar su mantenimiento preventivo, designar responsable técnico e implantar un Plan de Prevención y Control de Legionella (PPCL) con registros. Medidas generales: evitar estancamientos y suciedad, evitar que la temperatura del agua fría supere los 20 ºC (mediante aislamiento si fuera preciso) y minimizar aerosoles.</p>`],
["6. Caso práctico",CASO("Herida en la mano","Te has hecho un pequeño corte en un dedo y tienes que limpiar las colchonetas.","Cubrir el corte con un apósito impermeable, usar guantes y lavarse las manos tras retirarlos.")+CASO("Una usuaria sangra por la nariz sobre la colchoneta","Durante la clase, una usuaria sangra por la nariz y mancha la colchoneta y el suelo.","Delimitar la zona y evitar el contacto directo; con guantes desechables (y protección ocular si hay salpicaduras), retirar los restos, limpiar y desinfectar, quitarse los guantes y lavarse las manos. Comunicar cualquier exposición accidental.")]],
key:"Desinfecta el material compartido respetando tiempos de contacto, cubre tus heridas y, ante fluidos corporales, delimita, guantes, limpia, desinfecta y lávate las manos.",
q:[["Antes de reutilizar una colchoneta desinfectada:",["Usarla mojada","Dejarla secar","Ponerle toalla compartida","Nada"],1],
["Ante restos de vómito en la sala, lo primero:",["Recogerlo con la mano","Delimitar la zona y evitar el contacto directo","Taparlo con una toalla y seguir","Ignorarlo"],1],
["Un corte en la mano del técnico debe:",["Dejarse al aire","Cubrirse con apósito impermeable","Tocarse a menudo","Lavarse con desinfectante de suelos"],1],
["Una concentración de CO₂ superior a 800-1000 ppm indica:",["Buena ventilación","Ventilación deficiente","Exceso de luz","Calor"],1],
["Con riesgo de transmisión, las correcciones con contacto físico:",["Aumentan","Se limitan","Se hacen sin manos","Son obligatorias"],1],
["Tras quitarse los guantes:",["Lavarse las manos","Nada","Reutilizarlos","Guardarlos en el bolsillo"],0]]}
]};

{t:"Postura: bipedestación, demostraciones y trabajo en el suelo",ico:"🧍",min:11,src:ER+" · riesgo 260 (Moderado)",
obj:["Entender por qué la postura es uno de los riesgos más altos del puesto.","Aplicar las medidas de la evaluación al supervisar, corregir y demostrar."],
b:[["1. El riesgo",RK("260","Carga física: postura","Moderado",[2,2])+ALERT("Es uno de los riesgos <b>Moderado</b> de tu puesto: requiere esfuerzos para reducirlo y medidas implantadas en un plazo determinado.")],
["2. Qué provoca la carga postural",T(["Situación del puesto","Por qué carga"],[["Muchas horas de pie supervisando","Bipedestación prolongada en la misma posición"],["Corregir a la usuaria desde lejos","Flexión de tronco, giros y alcances"],["Demostraciones repetidas","Sobrecarga física acumulada"],["Ejercicios en el suelo","Posturas forzadas de rodillas o en cuclillas"],["Planificación con ordenador","Superficie y asiento inadecuados"]])],
["3. Medidas de la evaluación",UL(["Organizar sesiones y tareas complementarias alternando la <b>bipedestación dinámica</b> con actividades que permitan cambios posturales y recuperación; no permanecer de pie en una misma posición mucho tiempo.","Al supervisar y corregir: <b>acercarse a la usuaria</b> y adoptar una posición estable, evitando flexiones mantenidas del tronco, giros de espalda y brazos elevados prolongados.","Demostraciones durante el tiempo necesario, ajustando frecuencia e intensidad.","Ejercicios a nivel del suelo: <b>colchoneta como apoyo</b>, sin mantener posturas forzadas de rodillas o en cuclillas.","Material de uso frecuente a alturas accesibles.","Planificación con ordenador: superficie y asiento que permitan apoyar espalda y pies."])],
["4. Caso práctico",CASO("Corrección a distancia","En una clase de Pilates de suelo, la técnica corrige a una usuaria inclinándose desde lejos con el tronco flexionado y los brazos estirados durante largo rato.","Acercarse a la usuaria y adoptar una posición estable; si hay que bajar al suelo, apoyarse en una colchoneta y no mantener posturas forzadas de rodillas o en cuclillas.")+CASO("Seis clases seguidas de pie","El horario de un técnico tiene seis sesiones seguidas en las que solo supervisa de pie.","La evaluación pide organizar sesiones y tareas complementarias alternando bipedestación dinámica con cambios posturales y periodos de recuperación.")]],
key:"Acércate a la usuaria en lugar de inclinarte, alterna posturas, usa colchoneta en el suelo y limita las demostraciones a lo necesario.",
q:[["Valoración del riesgo de postura (260) en el puesto:",["Trivial","Moderado","Intolerable","No evaluado"],1],
["Para corregir a una usuaria:",["Inclinarse desde lejos","Acercarse y adoptar una posición estable","Gritar desde la otra punta","Agacharse en cuclillas mucho rato"],1],
["En ejercicios a nivel del suelo:",["Colchoneta como apoyo y evitar posturas forzadas mantenidas","Rodillas sobre el suelo duro","Siempre en cuclillas","Nada"],0],
["Las demostraciones deben:",["Repetirse todo lo posible","Limitarse al tiempo necesario","Hacerse con máxima carga","Evitarse siempre"],1],
["El material de uso frecuente se coloca:",["En el suelo","A alturas accesibles","Por encima de la cabeza","En el almacén cerrado"],1]]},
{t:"Sobresfuerzos, calentamiento y cuidado de la voz",ico:"🗣️",min:11,src:ER+" · riesgo 262 (Moderado)",
obj:["Aplicar las medidas frente a sobresfuerzos en el puesto.","Proteger la voz durante las sesiones."],
b:[["1. El riesgo",RK("262","Carga física: sobresfuerzos","Moderado",[2,2])],
["2. Tu cuerpo",UL(["Realizar <b>descansos</b> a lo largo de la jornada con ejercicios de estiramiento y relajación.","<b>Calentamiento</b> al inicio de las actividades deportivas.","Demostraciones con cargas e intensidades adecuadas, <b>sin repetir esfuerzos máximos</b> ni intentar sujetar de forma brusca una carga que cae.","Ajustar muelles y resistencias de las máquinas de Pilates con los mecanismos previstos, sin forzarlos y según fabricante."])],
["3. Tu voz",T(["Medida","Por qué"],[["Usar micrófono o similar","Evita forzar la voz en las exposiciones orales"],["No realizar esfuerzos vocales excesivos","Previene la sobrecarga vocal"],["Hidratación frecuente, evitando bebidas frías","Cuida las cuerdas vocales"],["Evitar cambios bruscos de condiciones ambientales","Reduce la irritación"]])],
["4. El material",UL(["Organizar preparación y recogida para <b>reducir traslados</b> de pesas, discos, mancuernas y bancos.","Antes de manipular: valorar peso, volumen y agarre, despejar el recorrido y pedir ayuda o usar medios auxiliares si no puede manejarse con seguridad.","Levantar y depositar cerca del cuerpo, flexionando rodillas, sin tirones ni giros; <b>cambiar de dirección moviendo los pies</b>.","Transportar cantidades manejables, sin acumular elementos que dificulten agarre o visibilidad."])],
["5. Caso práctico",CASO("Clase con música alta","Un técnico da tres clases de ciclo seguidas por encima de la música, sin micrófono, y bebe agua muy fría entre sesiones.","Usar micrófono o similar, no realizar esfuerzos vocales excesivos, hidratarse con frecuencia evitando bebidas frías y evitar cambios bruscos de condiciones ambientales.")+CASO("Coger la mancuerna que cae","A una usuaria se le escapa una mancuerna y el técnico se lanza a sujetarla.","La evaluación indica evitar intentar sujetar de forma brusca una carga que cae.")]],
key:"Calienta, haz pausas con estiramientos, usa micrófono, hidrátate sin bebidas frías y nunca intentes parar en seco una carga que cae.",

["Si una carga cae:",["Sujetarla bruscamente","Evitar sujetarla de forma brusca","Darle una patada","Agarrarla con una mano"],1],
["Al inicio de las actividades deportivas:",["Calentamiento","Esfuerzo máximo","Nada","Bebida fría"],0],
["Para cambiar de dirección con una carga:",["Girar el tronco","Mover los pies","Lanzarla","Hacer un tirón"],1],
["Los muelles del Reformer se ajustan:",["Forzándolos","Con los mecanismos previstos, según fabricante","Con una palanca improvisada","Con el pie"],1],
["Valoración del riesgo de sobresfuerzos (262):",["Moderado","Trivial","Intolerable","Tolerable"],0]]},
{t:"Manipulación manual de pesas, discos y bancos",ico:"📦",min:10,src:ER+" · riesgo 263 · maternidad (apartado de la evaluación)",
obj:["Aplicar la técnica de levantamiento descrita en la evaluación.","Organizar el almacenamiento para reducir la manipulación."],
b:[["1. El riesgo",RK("263","Carga física: manipulación manual de cargas","Tolerable",[1,2])],
["2. Organizar para manipular menos",UL(["Almacenar pesas, discos, mancuernas y material <b>cerca de sus zonas de uso</b>.","Los elementos <b>más pesados a niveles</b> que permitan cogerlos sin agacharse en exceso ni elevarlos por encima de los hombros.","Medios auxiliares o ayuda para bancos y elementos pesados o voluminosos."])],
["3. La técnica",FLOW(["Comprobar peso","Asegurar el agarre","Despejar el recorrido","Pies separados","Flexionar rodillas, espalda alineada","Carga pegada al cuerpo","Sin tirones ni giros","Depositar controlado sin dedos debajo"])],
["4. Adaptación",`<p>La empresa debe informar y formar sobre las técnicas de manipulación y <b>adaptar las tareas a las capacidades</b> de cada persona y a las restricciones individuales comunicadas por <b>Vigilancia de la Salud</b>.</p>`],
["5. Caso práctico",CASO("Discos en la balda alta","Los discos de 20 kg se guardan en la balda superior de la estantería, por encima de los hombros.","La evaluación pide situar los elementos más pesados en niveles que permitan recogerlos sin agacharse excesivamente ni elevarlos por encima de los hombros: reubicarlos en baldas intermedias.")+CASO("Tres mancuernas a la vez","Para ir rápido, llevas tres mancuernas apiladas que te tapan la vista.","Transportar cantidades manejables, manteniendo la visibilidad, y depositarlas de forma controlada sobre apoyos estables, sin poner los dedos debajo.")]],

["Al depositar una carga:",["Dejarla caer","De forma controlada sobre apoyos estables, sin dedos debajo","Con los dedos debajo","Girando el tronco"],1],

const M6={t:"Factores psicosociales, violencia y acoso",fmin:7,s:"Fatiga, estrés, desgaste profesional, organización, hiperconectividad y desconexión digital, violencia de usuarios, atracos y acoso laboral, sexual o por razón de sexo.",L:[
{t:"Fatiga, estrés, desgaste y organización del trabajo",ico:"🧠",min:12,src:ER+" · riesgos 270, 271, 274 y 273 (puesto y lugar)",
obj:["Conocer los cuatro factores psicosociales evaluados en el puesto.","Saber qué medidas organizativas recoge la evaluación."],
b:[["1. Los riesgos",T(["Nº","Factor","Valoración"],[["270","Fatiga",V("Tolerable")],["271","Estrés",V("Tolerable")],["274","Desgaste profesional",V("Tolerable")],["273","Organización",V("Tolerable")]])],
["2. Fatiga (270): horarios y sesiones",UL(["Horarios y sesiones respetando límites de jornada, pausas y descansos de la normativa y el convenio.","<b>Evitar acumular clases consecutivas</b> sin tiempo de recuperación.","Contar dentro de la jornada la preparación, recogida, planificación y atención a usuarias.","Participación del personal en los turnos, teniendo en cuenta necesidades individuales y de conciliación.","Calendario y cambios de horario comunicados con antelación; distribución previsible y equilibrada.","Criterios para que el correo electrónico o WhatsApp respeten el descanso y la desconexión digital."])],
["3. Estrés (271) y desgaste (274)",UL(["Evitar tareas innecesarias, sin recursos, que exijan saltarse los métodos o con instrucciones incompatibles.","Márgenes de tiempo que den cierta autonomía; programar trabajo y descanso.","Tareas definidas y repartidas de forma equitativa.","<b>Cambios en las condiciones de trabajo notificados con suficiente antelación</b>.","Se recomienda evitar que las trabajadoras embarazadas trabajen en solitario o deficientemente comunicadas."])],
["4. Organización (273)",UL(["Comunicación fluida, apoyo para resolver problemas, objetivos definidos y participación en decisiones.","Buenas relaciones interpersonales, evitando el aislamiento social o físico.","Apoyo social y apoyo de los superiores (reconocimiento, asistencia técnica y material).","Comunicación realista, libre de rumores, para prevenir la inseguridad laboral."])+NOTE("La evaluación del lugar de trabajo indica realizar una <b>evaluación específica de factores psicosociales</b> del puesto, con el Servicio de Prevención y la participación del personal (carga y ritmo, distribución de sesiones y descansos, horarios, exigencias de atención, autonomía y apoyo), y comunicar al Servicio de Prevención los cambios organizativos y los indicios de malestar.")],
["5. Caso práctico",CASO("Cambio de horario de un día para otro","El domingo por la noche se comunica por WhatsApp que el lunes la primera clase empieza dos horas antes.","La evaluación pide comunicar el calendario y los cambios con suficiente antelación y que las comunicaciones por correo o WhatsApp respeten los periodos de descanso y la desconexión digital.")]],
key:"Sesiones con tiempo de recuperación, horarios previsibles, tareas claras y repartidas, y cambios avisados con antelación. Los indicios de malestar se comunican al Servicio de Prevención.",
q:[["Clases consecutivas sin recuperación:",["Se deben evitar","Son lo ideal","Son obligatorias","Indiferente"],0],
["Los cambios de horario deben:",["Comunicarse con suficiente antelación","Decirse al llegar","No comunicarse","Decidirse por las usuarias"],0],
["La preparación y recogida de las sesiones:",["Fuera de jornada","Se contemplan dentro de la jornada","No existen","Las hace la usuaria"],1],
["La evaluación indica sobre la evaluación psicosocial:",["No hace falta","Realizar una evaluación específica con el Servicio de Prevención y participación del personal","Que la haga la usuaria","Solo si hay más de 500 trabajadores"],1],
["Una medida frente al desgaste profesional (274):",["Tareas definidas y repartidas equitativamente","Más clases seguidas","Cambios sin aviso","Aislamiento"],0]]},
{t:"Hiperconectividad y derecho a la desconexión digital",ico:"📵",min:8,src:ER+" · lugar de trabajo: «Hiperconectividad laboral» (273)",
obj:["Entender qué es la hiperconectividad laboral.","Conocer las obligaciones de la empresa en desconexión digital."],
b:[["1. Qué es",`<p>Según la evaluación, es la exigencia implícita o explícita de estar <b>disponible digitalmente fuera del horario laboral</b>, que puede generar estrés, fatiga mental y dificultades de conciliación, por la falta de límites en el uso de dispositivos y en la comunicación fuera de la jornada.</p>`+RK("273","Factores psicosociales derivados de la organización (hiperconectividad)","Tolerable",[1,2])],
["2. Qué debe hacer la empresa",`<p>Para garantizar el derecho a la desconexión digital (Ley Orgánica 3/2018 de Protección de Datos Personales y garantía de los derechos digitales y Ley 10/2021 de Trabajo a Distancia), la evaluación indica:</p>`+OL(["Elaborar e implantar un <b>procedimiento o protocolo de desconexión digital</b>.","<b>Formar al personal</b> sobre el derecho a la desconexión digital y el contenido del protocolo."])],
["3. Texto legal",LEY("<b>LO 3/2018, art. 88.1</b>: «Los trabajadores y los empleados públicos tendrán derecho a la desconexión digital a fin de garantizar, fuera del tiempo de trabajo legal o convencionalmente establecido, el respeto de su tiempo de descanso, permisos y vacaciones, así como de su intimidad personal y familiar.»")],
["4. Caso práctico",CASO("Mensajes de usuarias a las 23 h","Varias usuarias escriben al WhatsApp del técnico de noche para cambiar su reserva y esperan respuesta inmediata.","La evaluación pide criterios para que las comunicaciones por WhatsApp o correo respeten el descanso y la desconexión digital, y un protocolo de desconexión del que se informe y forme al personal.")]],
key:"Fuera de tu jornada tienes derecho a desconectar; la empresa debe tener un protocolo de desconexión digital y formarte sobre él.",
q:[["La hiperconectividad laboral es:",["Tener buena wifi","La exigencia de estar disponible digitalmente fuera del horario","Usar el móvil en clase","Un tipo de máquina"],1],
["La empresa debe:",["Prohibir los móviles","Elaborar un protocolo de desconexión digital y formar al personal","Exigir respuesta inmediata","Nada"],1],
["Norma citada por la evaluación sobre desconexión digital:",["LO 3/2018","RD 1215/1997","RD 487/2022","UNE 23035"],0],
["El derecho a la desconexión protege:",["El descanso, permisos, vacaciones e intimidad","Solo las vacaciones","Los equipos","A las usuarias"],0]]},
{t:"Violencia de usuarias y usuarios, agresiones y atracos",ico:"🛡️",min:11,src:ER+" · riesgos 190 y 272 (puesto y lugar)",
obj:["Actuar ante comportamientos agresivos.","Seguir las consignas ante un atraco y después del hecho."],
b:[["1. Los riesgos",RK("190","Agresiones de seres vivos","Tolerable",[1,2])+RK("272","Violencia ejercida por clientes o usuarios","Tolerable",[1,2])],
["2. Ante comportamientos agresivos",UL(["Priorizar tu integridad física y la de las usuarias.","Mantener la calma, <b>evitar discusiones y provocaciones</b>, conservar una distancia de seguridad y solicitar apoyo.","<b>No intentar contener físicamente</b> a la persona.","Seguir las instrucciones de actuación ante situaciones conflictivas."])],
["3. Ante un atraco",OL(["Mantener la calma; no gritar, no salir corriendo ni mentir sobre cosas fácilmente comprobables.","No oponer resistencia y entregar lo que exijan; sin movimientos bruscos.","Fijarse en las características del asaltante sin mirarlo fijamente: voz, acento, vehículo, dirección.","Recordar nombres o apodos que usen.","En lugar seguro, llamar al <b>112</b> (policía y, si hay heridos, ambulancias)."])+UL(["Si es posible con seguridad, alejarse y facilitar que las usuarias se aparten.","<b>No perseguir al agresor</b> ni asumir riesgos para identificarlo."])],
["4. Después del hecho",UL(["No tocar nada ni manipular objetos que haya tocado el autor (huellas).","Facilitar datos del suceso, del autor y de la huida.","Pedir datos y teléfono a los testigos.","Comunicarlo a la dirección del centro."])],
["5. Lo que organiza la empresa",UL(["Procedimiento de actuación ante situaciones conflictivas o violentas, informado al personal.","Medidas de seguridad como mostrador amplio, zonas de espera, alarmas, caja fuerte, mamparas, no tener objetos de valor a la vista.","Reducir fuentes de conflicto (tiempos de espera), instrucciones claras sobre obligaciones con los clientes, alternar atención al público con otras tareas."])],
["6. Caso práctico",CASO("Usuario muy alterado","Un usuario empieza a gritar en recepción porque no hay plaza en la clase y se acerca de forma amenazante.","Mantener la calma, no discutir ni provocar, guardar distancia de seguridad y pedir apoyo, sin intentar contenerlo físicamente; seguir el procedimiento y comunicarlo a la dirección.")+CASO("Robo en recepción","Una persona exige el dinero de la caja y huye. Una usuaria lo ha visto todo.","No oponer resistencia; una vez seguro, llamar al 112; no tocar lo que tocó el autor; pedir datos de contacto a la testigo; no perseguirlo; informar a la dirección.")]],
key:"Tu integridad primero: calma, distancia, sin resistencia ni persecuciones, 112 desde lugar seguro y no tocar nada.",
q:[["Ante un atraco:",["Oponer resistencia","No oponer resistencia y entregar lo que exijan","Perseguir al autor","Gritar"],1],
["Ante una persona agresiva:",["Contenerla físicamente","Mantener la calma, distancia de seguridad y pedir apoyo","Discutir","Provocarla"],1],
["Tras el robo, los objetos tocados por el autor:",["Limpiarlos","No manipularlos","Guardarlos","Tirarlos"],1],
["¿Cuándo se llama al 112?",["Durante el forcejeo","Una vez en situación segura","Nunca","Al día siguiente"],1],
["Con los testigos:",["Pedir sus datos y teléfono","Dejar que se vayan","Pedirles que persigan","Nada"],0],
["Una medida frente a la violencia de usuarios (272):",["Reducir tiempos de espera","Aumentar esperas","Quitar instrucciones","Atender siempre solo"],0]]},
{t:"Acoso laboral, sexual o por razón de sexo",ico:"🚫",min:9,src:ER+" · riesgo 275 · lugar: factores psicosociales (273)",
obj:["Conocer qué obliga la ley a la empresa en materia de acoso.","Saber a quién comunicar una situación de acoso."],
b:[["1. El riesgo",RK("275","Acoso laboral, sexual o por razón de sexo","Tolerable",[1,2])],
["2. Marco legal citado por la evaluación",LEY("<b>LO 3/2007</b> para la igualdad efectiva de mujeres y hombres (arts. 45, 46 y 48) y <b>LO 10/2022</b> de garantía integral de la libertad sexual (art. 12): la empresa debe arbitrar un <b>procedimiento específico</b> para prevenir el acoso sexual y por razón de sexo y dar cauce a denuncias o reclamaciones, incluidas las del <b>ámbito digital</b>. Empresas de más de 50 personas trabajadoras: plan de igualdad.")+`<p>La evaluación define el acoso por razón de sexo como cualquier comportamiento realizado en función del sexo de una persona, con el propósito o efecto de atentar contra su dignidad y crear un entorno intimidatorio, degradante u ofensivo.</p>`],
["3. Medidas (negociadas con la representación de las personas trabajadoras)",UL(["Códigos de buenas prácticas.","Campañas informativas.","Protocolos de actuación.","Acciones formativas, informando y formando sobre el riesgo de violencia sexual en el puesto."])],
["4. Qué hacer",ALERT("Ante una situación de acoso laboral, sexual o por razón de sexo, ponla en conocimiento de los <b>responsables designados por la empresa</b> lo antes posible. Si no sabes quiénes son, contacta con el <b>responsable de la empresa</b>.")],
["5. Caso práctico",CASO("Comentarios en el chat del equipo","Una compañera recibe repetidamente comentarios de contenido sexual en el grupo de WhatsApp del trabajo.","Es una situación que el procedimiento debe cubrir (incluido el ámbito digital). Comunicarla lo antes posible a los responsables designados por la empresa o, si no se conocen, al responsable de la empresa.")]],
key:"El acoso, también el digital, se comunica cuanto antes a las personas designadas por la empresa o, si no las conoces, al responsable de la empresa.",
q:[["Una situación de acoso se comunica a:",["Las usuarias","Los responsables designados por la empresa (o al responsable de la empresa)","Nadie","Redes sociales"],1],
["El procedimiento frente al acoso sexual debe incluir:",["Solo el ámbito presencial","También el ámbito digital","Solo a directivos","Nada"],1],
["Las medidas frente al acoso se negocian con:",["La representación de las personas trabajadoras","Los proveedores","Las usuarias","Nadie"],0],
["Ley orgánica de garantía integral de la libertad sexual:",["LO 10/2022","LO 3/2018","Ley 31/1995","RD 485/1997"],0],
["Plan de igualdad obligatorio en empresas de:",["Más de 50 trabajadores","Más de 5","Más de 1000","Ninguna"],0]]}
]};
const M7={t:"Emergencias, primeros auxilios, desplazamientos y protección de la maternidad",fmin:8,s:"Incendio y evacuación, extintores, señalización y alumbrado de emergencia, botiquín y primeros auxilios, accidentes in itinere, coordinación con empresas externas y protección de trabajadoras embarazadas o en lactancia.",L:[
{t:"Incendio y evacuación",ico:"🔥",min:13,src:ER+" · riesgo 180 (puesto y lugar) · vías y salidas de evacuación · alumbrado de emergencia",
obj:["Prevenir el incendio en el centro.","Saber actuar ante humo o fuego y evacuar a las usuarias.","Conocer los medios de protección y su mantenimiento."],
b:[["1. El riesgo",RK("180","Incendio","Tolerable",[1,2])],
["2. Prevención",UL(["Salas y almacenes <b>sin acumulaciones de cartón, papel</b> y combustibles, lejos de fuentes de calor y equipos eléctricos.","Productos de limpieza almacenados según etiqueta y FDS, atención a los inflamables; <b>no dejarlos junto a enchufes</b>.","Evitar sobrecargas eléctricas y retirar aparatos con cables deteriorados, chispazos o calentamientos.","Respetar la prohibición de fumar y la señalización.","<b>Recorridos y salidas de evacuación despejados</b>: sin pesas, bancos, colchonetas u otros materiales, ni siquiera temporalmente. Nunca almacenar en salidas de emergencia.","Extintores, pulsadores y cuadros accesibles; señalización y alumbrado de emergencia en buen estado."])],
["3. Ante humo o fuego",FLOW(["Interrumpir la actividad","Dar la alarma","Avisar al 112","Evacuar con las usuarias al punto de reunión"])+ALERT("Usa un extintor <b>solo si tienes formación, el fuego es incipiente y mantienes una vía de salida segura</b>, sin retrasar la evacuación ni exponerte al humo. Si no se controla rápido: alarma, aviso a extinción y evacuación.")+`<p>Debes conocer las medidas de emergencia del centro, la ubicación de los medios de extinción, las vías de evacuación y cómo avisar y acompañar a las usuarias al punto de reunión. Colabora en los simulacros.</p>`],
["4. Extintores",T(["Revisión","Quién","Qué"],[["Cada 3 meses","La propia empresa","Accesibilidad, precintos, manguera, estado de carga"],["Cada año","Mantenedor autorizado","Presión de impulsión, carga, manguera, boquilla, lanza"],["Cada 5 años","Mantenedor autorizado","Retimbrado"]])+UL(["Visibles y accesibles, cerca de los puntos de mayor probabilidad de incendio y de las salidas.","Parte superior entre <b>0,80 m y 1,20 m</b> del suelo.","Recorrido máximo de <b>15 m</b> hasta el extintor más próximo."])],
["5. Señalización y alumbrado",UL(["Recorridos y salidas señalizados con señales normalizadas, visibles, en los cambios de dirección y visibles si falla el alumbrado.","Señales fotoluminiscentes (UNE 23033-1, UNE 23034, UNE 23035), revisadas anualmente.","Alumbrado de emergencia comprobado periódicamente, reparado y con registro de la revisión.","Comunicar cualquier obstáculo en las vías de evacuación."])],
["6. Casos prácticos",CASO("Colchonetas en la salida","Tras una clase con mucha gente, se apilan las colchonetas delante de la salida de emergencia «solo un rato».","Prohibido: las vías de evacuación no se obstaculizan ni siquiera con carácter temporal y nunca se almacena material en las salidas de emergencia.")+CASO("Olor a quemado en el almacén","Detectas humo saliendo de una regleta del almacén con cartones alrededor durante una clase.","Si el fuego es incipiente, tienes formación y una salida segura, puedes usar el extintor adecuado. Si no: interrumpir la actividad, dar la alarma, avisar al 112 y evacuar acompañando a las usuarias al punto de reunión.")]],
key:"Vías de evacuación siempre libres; ante humo o fuego: parar, alarma, 112 y evacuar con las usuarias. Extintor solo si el fuego es incipiente, sabes usarlo y tienes salida.",
q:[["Las vías de evacuación:",["Pueden usarse para material temporalmente","No se obstaculizan ni siquiera temporalmente","Se cierran con llave","Indiferente"],1],
["Usar un extintor solo si:",["Hay formación, el fuego es incipiente y hay vía de salida segura","Siempre","Nunca","Hay mucho humo"],0],
["Revisión trimestral de extintores la hace:",["La propia empresa","Bomberos","Usuarias","Nadie"],0],
["Retimbrado del extintor:",["Cada 5 años","Cada mes","Nunca","Cada 20 años"],0],
["Distancia máxima a un extintor:",["15 m","50 m","100 m","1 m"],0],
["Ante humo durante una clase, lo primero:",["Seguir la clase","Interrumpir la actividad y dar la alarma","Buscar el móvil","Grabar vídeo"],1],
["El alumbrado de emergencia:",["Se comprueba periódicamente con registro","No se revisa","Se desconecta","Solo de día"],0]]},
{t:"Primeros auxilios y botiquín",ico:"🩹",min:9,src:ER+" · lugar: «Material y locales de primeros auxilios» (300) · riesgo 210 (fluidos) · 190 (112)",
obj:["Localizar y mantener el botiquín.","Conocer el contenido mínimo exigido.","Actuar con seguridad ante sangre y otros fluidos."],
b:[["1. El riesgo",RK("300","Otros (material y locales de primeros auxilios)","Tolerable",[1,2])],
["2. El botiquín",UL(["Señalizado con la señal normalizada de primeros auxilios: <b>cruz blanca sobre fondo verde</b> (RD 485/1997), en lugar visible.","Acceso libre de obstáculos; que la señal no quede tapada por mobiliario o material deportivo.","<b>Revisión periódica</b>: pedir reposición del material caducado o agotado."])+T(["Contenido mínimo según la evaluación"],[["Desinfectantes y antisépticos autorizados"],["Gasas estériles"],["Algodón hidrófilo"],["Venda"],["Esparadrapo"],["Apósitos adhesivos"],["Tijeras"],["Pinzas"],["Guantes desechables"]])],
["3. Protegerse al atender",UL(["Ante sangre, vómitos u otros fluidos: delimitar la zona, evitar el contacto directo, <b>guantes desechables</b> (y protección ocular o facial si hay salpicaduras), retirar, limpiar, desinfectar y lavarse las manos.","Comunicar cualquier exposición accidental para su valoración y seguimiento.","Si hay heridos en una agresión o emergencia: llamar al <b>112</b>."])],
["4. Lo que no recoge la evaluación",NOTE("La evaluación no incluye técnicas de primeros auxilios (soporte vital, RCP, uso de desfibrilador, actuación ante lesiones deportivas) ni designa personal de primeros auxilios o un plan de emergencia del centro. Este curso no las añade para no salir del contenido de la evaluación. Consulta a la empresa quién está designado para primeros auxilios y emergencias (art. 20 de la Ley 31/1995).")],
["5. Caso práctico",CASO("Botiquín sin guantes","Una usuaria se hace una herida en la mano con el canto de un disco y al abrir el botiquín no quedan guantes desechables ni gasas.","Usar lo disponible protegiéndose del contacto directo con la sangre y pedir la reposición del material agotado; el botiquín debe revisarse periódicamente y contener como mínimo guantes desechables y gasas estériles. Retirar del uso el disco con rebabas y comunicarlo.")]],
key:"Sabe dónde está el botiquín (cruz blanca sobre verde), mantenlo accesible y completo, protégete con guantes ante la sangre y llama al 112 si hay heridos.",
q:[["Señal del botiquín:",["Cruz blanca sobre fondo verde","Triángulo amarillo","Círculo rojo","Cuadrado azul"],0],
["Si falta material en el botiquín:",["Solicitar reposición del material caducado o agotado","Esperar a la inspección","Nada","Comprarlo la usuaria"],0],
["¿Cuál forma parte del contenido mínimo?",["Guantes desechables","Medicamentos con receta","Bebidas isotónicas","Ninguno"],0],
["El acceso al botiquín:",["Libre de obstáculos","Detrás de las colchonetas","Bajo llave sin aviso","En el almacén"],0],
["Ante sangre de una usuaria:",["Tocarla sin protección","Guantes desechables y evitar contacto directo","Ignorarla","Limpiar con la toalla compartida"],1]]},
{t:"Desplazamientos: accidentes in itinere",ico:"🚶",min:7,src:ER+" · lugar: «Accidentes in itinere e in misión» (201)",
obj:["Aplicar las normas de seguridad vial al ir y volver del trabajo.","Conocer las normas para peatones."],
b:[["1. El riesgo",RK("201","Accidente de tráfico","Tolerable",[1,2])],
["2. Si conduces",UL(["Comprobar frenos, faros, intermitentes, neumáticos antes de conducir.","Cumplir las normas de tráfico y seguridad vial.","<b>No consumir alcohol, psicótropos o medicamentos</b> que alteren la conducta o los reflejos.","<b>Cinturón de seguridad</b> obligatorio.","Manos libres autorizado si es imprescindible el móvil; volumen de radio que permita escuchar.","Carné adecuado al vehículo."])],
["3. Si vas a pie",OL(["Cruzar por pasos de cebra, con el semáforo de peatones en verde y mirando a ambos lados.","No cruzar corriendo; asegurarse de tener tiempo suficiente.","No subir ni bajar del transporte público en marcha.","Tras bajar de un vehículo, cruzar por su parte posterior.","Circular por la acera; si es por el arcén, siempre por la izquierda."])],
