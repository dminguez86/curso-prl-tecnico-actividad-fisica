<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso PRL · Técnico/a de actividades físicas y entrenamiento</title>
<meta name="description" content="Formación PRL (art. 19 Ley 31/1995) para el puesto de Técnico/a de actividades físicas y entrenamiento, basada en la evaluación de riesgos.">
<style>
html{--bg:#eef5f9;--card:#fff;--txt:#1d2b36;--mut:#4a5a68;--pri:#0277ab;--pri2:#009CD7;--acc:#128a3c;--acc2:#16B14C;--bd:#d6e4ec;--ok:#15803d;--ko:#c62828;--amb:#a15c00;--navy:#06476b;--navy2:#0277ab;--btnTxt:#fff;--tagTxt:#035f8c}
html[data-theme=dark]{--bg:#06131c;--card:#0d2130;--txt:#e8f0f6;--mut:#a9bccb;--pri:#4cc0f0;--pri2:#38b6ec;--acc:#3ddc84;--acc2:#3ddc84;--bd:#24445a;--ok:#22c55e;--ko:#ff6b6b;--amb:#fbbf24;--navy:#041e2e;--navy2:#06476b;--btnTxt:#04121d;--tagTxt:#9fdcf7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;
background-image:radial-gradient(1100px 600px at 100% -10%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
a{color:var(--pri)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--acc2);box-shadow:0 4px 18px #0003}
header h1{font-size:1rem;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
header h1 span{overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff1a;border:1px solid #ffffff40;color:#fff}
.logo-h{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:block;flex:none}
.prog{flex:2;max-width:320px;height:8px;background:#ffffff30;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#009CD7,#16B14C);transition:width .5s}
#pct{font-size:.85rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:9999px;padding:7px 14px;transition:transform .15s,background .2s}button:hover{transform:translateY(-1px)}
.btn{background:var(--pri);color:var(--btnTxt);border:none;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}
.wrap{display:flex;max-width:1240px;margin:auto}
nav{width:290px;flex:none;padding:16px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;background:color-mix(in srgb,var(--card) 70%,transparent)}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--txt);text-decoration:none;margin-bottom:2px;cursor:pointer;font-size:.88rem}
nav a:hover{background:color-mix(in srgb,var(--pri) 10%,transparent)}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:var(--btnTxt)}nav a .ck{margin-left:auto}
nav details.ng{background:none;border:none;margin:6px 0}nav details.ng summary{padding:8px 10px;font-size:.92rem}nav details.ng summary small{color:var(--mut);font-weight:400}
main{flex:1;padding:22px;min-width:0}
.view{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{letter-spacing:-.01em;line-height:1.25}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px #0000000d,0 8px 24px #0a1f330d}
.lc{cursor:pointer;transition:transform .2s,box-shadow .2s}.lc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #00000022}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pri2) 14%,var(--card));color:var(--tagTxt);border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
.tag.t2{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
details.bl{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
details.bl summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}details.bl summary::-webkit-details-marker{display:none}
details.bl summary::after{content:"＋";float:right;color:var(--pri)}details.bl[open] summary::after{content:"－"}
details.bl>div{padding:0 16px 14px}
.key{border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.note{border-left:5px solid var(--pri2);background:color-mix(in srgb,var(--pri2) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.alert{border-left:5px solid var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.caso{border:2px dashed color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 6%,var(--card));padding:12px 14px;border-radius:12px;margin:12px 0}
.caso>b:first-child{color:var(--pri)}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.sem>div{border-radius:12px;padding:12px;border:2px solid}
.sv{border-color:#16B14C!important;background:color-mix(in srgb,#16B14C 10%,var(--card))}.sa{border-color:#f59e0b!important;background:color-mix(in srgb,#f59e0b 12%,var(--card))}.sr{border-color:#e53935!important;background:color-mix(in srgb,#e53935 10%,var(--card))}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.flow span{background:color-mix(in srgb,var(--pri) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 40%,transparent);border-radius:10px;padding:6px 10px;font-size:.88rem}.flow i{font-style:normal;color:var(--pri);font-weight:800}
.q{margin:16px 0}.q p{font-weight:700;margin:.2em 0 .5em}.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt:disabled{cursor:default;transform:none;opacity:1}
html[data-theme=dark] .opt.ok,html[data-theme=dark] .opt.ko{color:#04121d}
.fb{font-size:.9rem;min-height:1.2em;font-weight:600}.score{font-size:1.15rem;font-weight:800}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
figure{margin:12px 0;text-align:center}figure img{max-width:100%;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;background:#fff}figcaption{font-size:.8rem;color:var(--mut)}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fade .25s}.lb img{max-width:96vw;max-height:92vh;border-radius:8px;background:#fff}.lb button{position:fixed;top:12px;right:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:.88rem;margin:4px 0 8px}
.hx{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:40px 34px;background:linear-gradient(135deg,var(--navy) 0%,#035f8c 55%,#0291CE 100%);box-shadow:0 20px 50px #0a1f3355;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#009CD7 0 50%,#16B14C 50% 100%)}
.hx>*{position:relative;min-width:0}
.logo-x{height:54px;background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:14px;box-shadow:0 6px 18px #0003;max-width:100%}
.eyb{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9ff0bb}
.eyb::before{content:"";width:26px;height:2px;background:#16B14C}
.hx h2{font-size:clamp(1.7rem,4.4vw,3.1rem);line-height:1.07;margin:.35em 0 .3em;font-weight:800}
.hx h2 em{font-style:normal;color:#9ff0bb}
.hx p.sub{font-size:1.04rem;color:#e1eef7;max-width:580px;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:#0f7a35;color:#fff;border:none;font-weight:800;padding:13px 26px;font-size:1.02rem;box-shadow:0 8px 24px #16b14c55}
.go2{background:transparent;color:#fff;border:1px solid #ffffff66;padding:12px 18px}
.pbar{margin-top:18px;max-width:420px}.pbar small{color:#d3e4f0}.pbar div{height:8px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.rack{width:100%;max-width:400px;justify-self:center}
.rack .box{animation:drop 5s ease-in-out infinite;transform-box:fill-box}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}15%,85%{transform:none;opacity:1}100%{transform:none;opacity:1}}
.rack .fork{animation:fork 5s ease-in-out infinite}@keyframes fork{0%,100%{transform:translate(0,0)}40%{transform:translate(0,-62px)}60%{transform:translate(0,-62px)}}
.rack .lamp{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.rack .scan{animation:scan 3.5s linear infinite}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;border-top:3px solid var(--acc2)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;color:var(--pri)}.stat span{font-size:.85rem;color:var(--mut)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.mc .n{font-size:2.6rem;font-weight:800;color:color-mix(in srgb,var(--pri2) 25%,transparent);position:absolute;right:14px;top:4px}
.mc h3{margin:.4em 0 .2em;font-size:1.02rem}.mc p{margin:0;color:var(--mut);font-size:.88rem}
.mp{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.mp i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.sech::after{content:"";flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.grid .card{margin:0}.grid h4{margin:.4em 0}
.hero{background:linear-gradient(135deg,var(--navy),#035f8c 60%,#0291CE);color:#fff;border-radius:18px;padding:26px}
.hero h2{margin:.2em 0}
.gym{width:100%;max-width:400px;justify-self:center}
.gym .bar{animation:lift 2.6s ease-in-out infinite}@keyframes lift{0%,100%{transform:translateY(160px)}45%,60%{transform:translateY(96px)}}
.gym .arm1{animation:a1 2.6s ease-in-out infinite;transform-origin:115px 150px}.gym .arm2{animation:a2 2.6s ease-in-out infinite;transform-origin:155px 150px}
@keyframes a1{0%,100%{transform:rotate(-60deg)}45%,60%{transform:rotate(0)}}@keyframes a2{0%,100%{transform:rotate(60deg)}45%,60%{transform:rotate(0)}}
.gym .kb{animation:sw 3s ease-in-out infinite;transform-origin:258px 240px}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.gym .pulse{stroke-dasharray:240;animation:pl 2s linear infinite}@keyframes pl{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
.vb{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:1px 10px;border:1px solid;white-space:nowrap}
.v-trivial{background:#e6f4ea;color:#14532d;border-color:#15803d}.v-tolerable{background:#e0f2fe;color:#0c4a6e;border-color:#0369a1}.v-moderado{background:#fef3c7;color:#713f12;border-color:#a16207}.v-importante{background:#ffedd5;color:#7c2d12;border-color:#c2410c}.v-intolerable{background:#fee2e2;color:#7f1d1d;border-color:#b91c1c}
.rk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--pri) 5%,var(--card))}.rk small{color:var(--mut)}
.rc{font-weight:800;font-size:.8rem;background:var(--pri);color:var(--btnTxt);border-radius:8px;padding:1px 8px}
.ley{border-left:5px solid #7c3aed;background:color-mix(in srgb,#7c3aed 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
html[data-theme=dark] .ley{border-color:#c4b5fd}
.cert{background:#fff;color:#1d2b36;border:3px double #0277ab;border-radius:16px;padding:28px;text-align:center;margin:14px 0}.cert h2{color:#06476b}.cert .cn{font-size:1.6rem;font-weight:800;border-bottom:2px solid #16B14C;display:inline-block;min-width:60%;padding:0 10px}.cert th{background:#e0eef6;color:#1d2b36}.cert td,.cert th{border-color:#b9cfdc}.cert p[style]{color:#4a5a68!important}
.firmas{display:flex;justify-content:space-around;gap:20px;margin-top:50px;flex-wrap:wrap}.firmas div{border-top:1px solid #4a5a68;padding-top:6px;min-width:200px;font-size:.85rem}
button:disabled{opacity:.55;cursor:not-allowed}
.ub{max-width:200px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.ub span{overflow:hidden;text-overflow:ellipsis}
body.noauth nav,body.noauth .prog,body.noauth #pct{display:none}
.auth{max-width:760px;margin:auto}.ah{grid-template-columns:1.3fr 1fr}.ah .gym{max-width:260px}
.tabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.af label{display:block;font-weight:700;margin:10px 0;font-size:.92rem}.af input:not([type=checkbox]),.af select{display:block;width:100%;font:inherit;font-weight:400;padding:10px 12px;margin-top:4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.af input:focus,.af select:focus{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent)}
.af .chk{display:flex;gap:8px;align-items:flex-start;font-weight:600}.af .chk input{width:20px;height:20px;flex:none;margin-top:2px}
.rgpd{font-size:.82rem}.err{color:var(--ko);font-weight:700;min-height:1.2em}
.sw{text-align:left}
[hidden]{display:none!important}#menu{display:none}
ul,ol{padding-left:1.3em}li{margin:3px 0}
@media(max-width:1000px){.mods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hx{grid-template-columns:1fr;padding:28px 20px 32px}.rack,.gym{max-width:260px;order:-1}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){nav{position:fixed;left:0;top:59px;background:var(--card);z-index:9;transform:translateX(-105%);transition:transform .3s;border-right:1px solid var(--bd);width:min(290px,86vw)}nav.open{transform:none}#menu{display:inline-block}.prog{display:none}}
@media(max-width:600px){main{padding:14px 12px}.mods{grid-template-columns:1fr}.sem{grid-template-columns:1fr}.logo-h{height:28px}.logo-x{height:44px}header{gap:8px;padding:10px}header h1{font-size:.88rem}.card{padding:14px}details.bl>div{padding:0 12px 12px}}
@media(max-width:420px){#pct{display:none}.ub{max-width:110px;padding:6px 10px}.ah{padding:22px 16px}header h1 span{max-width:40vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.pn,.noprint,.alert{display:none!important}.cert{border-color:#0277ab}main{padding:0}body{background:#fff;color:#000}.wrap{display:block}details.bl{break-inside:avoid}}
</style>
</head>

const M1={t:"Tu formación, tus derechos y la evaluación de tu puesto",fmin:8,s:"Por qué recibes esta formación (art. 19), qué derechos y obligaciones tienes (arts. 18 y 29) y cómo se ha evaluado el puesto de Técnico/a de actividades físicas y entrenamiento.",L:[
{t:"El art. 19 de la Ley 31/1995: la formación que estás haciendo",ico:"⚖️",min:10,src:"Ley 31/1995, art. 19 (texto legal) · "+ER+" (acuse de recibo)",
obj:["Conocer qué exige el art. 19 de la Ley de Prevención de Riesgos Laborales.","Saber cuándo debe impartirse y repetirse la formación.","Entender por qué este curso está centrado en tu puesto concreto."],
b:[["1. Qué dice la ley",LEY("Art. 19.1: «En cumplimiento del deber de protección, el empresario deberá garantizar que cada trabajador reciba una formación teórica y práctica, suficiente y adecuada, en materia preventiva, tanto en el momento de su contratación, cualquiera que sea la modalidad o duración de ésta, como cuando se produzcan cambios en las funciones que desempeñe o se introduzcan nuevas tecnologías o cambios en los equipos de trabajo.»")+LEY("Art. 19.1 (cont.): «La formación deberá estar centrada específicamente en el puesto de trabajo o función de cada trabajador, adaptarse a la evolución de los riesgos y a la aparición de otros nuevos y repetirse periódicamente, si fuera necesario.»")+LEY("Art. 19.2: «La formación a que se refiere el apartado anterior deberá impartirse, siempre que sea posible, dentro de la jornada de trabajo o, en su defecto, en otras horas pero con el descuento en aquélla del tiempo invertido en la misma. La formación se podrá impartir por la empresa mediante medios propios o concertándola con servicios ajenos, y su coste no recaerá en ningún caso sobre los trabajadores.»")],
["2. Las características de la formación, en una tabla",T(["Requisito del art. 19","Cómo se aplica en este curso"],[["Teórica y práctica","Cada lección explica las medidas de la evaluación y las aplica a casos prácticos del día a día en la sala."],["Suficiente y adecuada","Recorre todos los riesgos identificados en tu puesto, en los lugares de trabajo, en los equipos y en los productos químicos."],["Centrada en el puesto","Todo el contenido sale de la evaluación del puesto de Técnico/a de actividades físicas y entrenamiento de Nesta Studios."],["Al contratar y ante cambios","Al incorporarte, y de nuevo si cambian tus funciones, los equipos (p. ej. nuevas máquinas) o se introducen nuevas tecnologías."],["Adaptada a la evolución de los riesgos","Si la evaluación se revisa, la formación debe actualizarse."],["Dentro de la jornada y sin coste","Siempre que sea posible en horario de trabajo; nunca a cargo de la persona trabajadora."]])],
["3. Qué dice la propia evaluación",`<p>El acuse de recibo de la evaluación de riesgos recuerda exactamente este deber:</p><div class="card key" style="margin:0">«En cumplimiento del deber de protección, el empresario deberá garantizar que cada trabajador reciba una formación teórica y práctica en materia preventiva. Esta formación deberá estar centrada específicamente en el puesto de trabajo o función de cada trabajador.»</div><p>La evaluación indica además que el empresario pondrá a disposición de los trabajadores la evaluación de riesgos de su puesto y la planificación, e informará de los riesgos y de las medidas a adoptar (arts. 18 y 20 de la Ley 31/1995).</p>${NOTE("Varias medidas de la evaluación piden expresamente formación: «El personal técnico deberá disponer de formación e información sobre los equipos que utilice, ajuste o supervise» (riesgo 110), «Informar y formar al personal sobre las técnicas de manipulación» (263), «formar al personal en los ajustes, selección de resistencias, bloqueos y dispositivos de seguridad» del Reformer-Cadillac y formar sobre el derecho a la desconexión digital.")}`],
["4. Cómo está organizado el curso",T(["Módulo","Contenido"],[["1","Ley, derechos, obligaciones y cómo se ha evaluado tu puesto"],["2","La sala: caídas, pisadas, choques, caída de objetos, iluminación y ambiente"],["3","Equipos de trabajo: Reformer-Cadillac, material de gimnasio, aspiradora, lavadora, ordenadores"],["4","Riesgo eléctrico, productos químicos y agentes biológicos"],["5","Carga física: posturas, sobreesfuerzos (incluida la voz) y manipulación de cargas"],["6","Factores psicosociales, violencia de usuarios y acoso"],["7","Emergencias, incendio, primeros auxilios, desplazamientos, maternidad y coordinación"]])+`<p>Al final hay una <b>evaluación final del curso</b> y una <b>constancia de formación</b> imprimible.</p>`],
["5. Caso práctico",CASO("«La formación, fuera de horas y la pagas tú»","Una nueva técnica se incorpora el lunes. Le dicen que el curso de PRL lo haga en casa el fin de semana y que, si quiere el certificado, abone la plataforma.","No se ajusta al art. 19.2: la formación debe impartirse, siempre que sea posible, dentro de la jornada o, si no, en otras horas descontando ese tiempo de la jornada, y su coste no recae en ningún caso sobre la persona trabajadora. Además, debe recibirse en el momento de la contratación.")]],
key:"La formación preventiva es una obligación del empresario: teórica y práctica, suficiente y adecuada, centrada en tu puesto, al contratar y cuando cambian funciones o equipos, dentro de la jornada y sin coste para ti.",
q:[["Según el art. 19, la formación preventiva debe ser:",["Solo teórica","Teórica y práctica, suficiente y adecuada","Solo práctica","Opcional si el puesto es de bajo riesgo"],1],
["¿Cuándo debe impartirse, como mínimo?",["Solo cuando hay un accidente","Al contratar y cuando cambian funciones, tecnologías o equipos","Cada cinco años","Cuando la pida el trabajador"],1],
["¿Quién asume el coste de la formación?",["La persona trabajadora","A medias","En ningún caso la persona trabajadora","La mutua obligatoriamente"],2],
["La formación debe estar centrada en:",["El sector en general","El puesto de trabajo o función de cada trabajador","La normativa europea","Los riesgos de otras empresas"],1],
["Si no puede darse dentro de la jornada:",["Se hace en tiempo libre sin compensar","Se hace en otras horas descontando ese tiempo de la jornada","No se hace","Se paga como horas extra obligatoriamente"],1],
["Si se introduce una nueva máquina de Pilates en la sala:",["No hace falta formar","Es un cambio en los equipos que exige formación","Solo se forma a la dirección","Basta con dejar el manual"],1]]},
{t:"Tus derechos: información, consulta y participación (art. 18)",ico:"📢",min:9,src:"Ley 31/1995, art. 18 (texto legal) · "+ER,
obj:["Saber qué información tienes derecho a recibir.","Conocer tu derecho a ser consultado y a hacer propuestas.","Relacionar el art. 18 con la evaluación de tu puesto."],
b:[["1. Derecho a la información",LEY("Art. 18.1: el empresario adoptará las medidas adecuadas para que los trabajadores reciban todas las informaciones necesarias en relación con: a) los riesgos para la seguridad y la salud de los trabajadores en el trabajo, tanto aquellos que afecten a la empresa en su conjunto como a cada tipo de puesto de trabajo o función; b) las medidas y actividades de protección y prevención aplicables a los riesgos señalados en el apartado anterior; c) las medidas adoptadas de conformidad con lo dispuesto en el artículo 20 (emergencias).")+`<p>En las empresas con representantes de los trabajadores, la información se facilita por medio de ellos, aunque debe informarse directamente a cada trabajador de los riesgos específicos de su puesto y de las medidas aplicables (texto legal, art. 18.1).</p>`],
["2. Derecho a la consulta y a la participación",LEY("Art. 18.2: el empresario deberá consultar a los trabajadores, y permitir su participación, en el marco de todas las cuestiones que afecten a la seguridad y a la salud en el trabajo. Los trabajadores tendrán derecho a efectuar propuestas al empresario, así como a los órganos de participación y representación, dirigidas a la mejora de los niveles de protección de la seguridad y la salud en la empresa.")],
["3. Cómo se concreta en tu evaluación",T(["Lo que dice la evaluación","Derecho relacionado"],[["«Se pondrá en conocimiento de los delegados de prevención y trabajadores el presente informe para que sean informados de la Evaluación de los Riesgos que afectan a su puesto de trabajo.»","Información (18.1)"],["El empresario pondrá a disposición la evaluación y la planificación e informará de los riesgos y medidas (arts. 18 y 20).","Información (18.1 a, b, c)"],["Mantener las fichas de datos de seguridad accesibles al personal e informar de peligros, diluciones e incompatibilidades.","Información sobre riesgos químicos"],["Favorecer la participación del personal en la organización de los turnos.","Consulta y participación (18.2)"],["Fomentar la participación de los trabajadores en la toma de decisiones (riesgo 273).","Consulta y participación (18.2)"],["La evaluación psicosocial específica se hará «con la participación del personal».","Participación (18.2)"]])],
["4. Caso práctico",CASO("No sé qué riesgos tiene mi puesto","Un técnico lleva dos meses en el centro y nunca le han enseñado qué riesgos se identificaron en su puesto ni qué hacer en caso de incendio.","Tiene derecho a recibir información directa sobre los riesgos específicos de su puesto, sus medidas preventivas y las medidas de emergencia (art. 18.1 a, b y c). La evaluación prevé ponerla en conocimiento de trabajadores y delegados. Puede solicitarla y hacer propuestas de mejora (art. 18.2).")]],
key:"Tienes derecho a conocer los riesgos de tu puesto, sus medidas y las medidas de emergencia, a ser consultado y a proponer mejoras.",
q:[["El art. 18 regula:",["Las sanciones","La información, consulta y participación de los trabajadores","Los EPI","Las vacaciones"],1],
["¿Qué información incluye el art. 18.1?",["Solo los riesgos de la empresa en su conjunto","Riesgos, medidas preventivas y medidas de emergencia","Solo el plan de igualdad","Solo los salarios"],1],
["Aunque haya representantes, debe informarse directamente a cada trabajador de:",["Los resultados económicos","Los riesgos específicos de su puesto y sus medidas","Los datos médicos de los compañeros","Nada"],1],
["Los trabajadores pueden hacer propuestas de mejora:",["No, nunca","Sí, al empresario y a los órganos de participación","Solo por escrito ante notario","Solo los delegados"],1],
["La evaluación de tu puesto prevé que se ponga en conocimiento de:",["Solo la dirección","Delegados de prevención y trabajadores","Las usuarias","Nadie"],1]]},
{t:"Tus obligaciones en prevención (art. 29)",ico:"🦺",min:9,src:"Ley 31/1995, art. 29 (texto legal) · "+ER,
obj:["Conocer las seis obligaciones del art. 29.","Aplicarlas a situaciones del centro de entrenamiento.","Saber las consecuencias de su incumplimiento."],
b:[["1. El principio general",LEY("Art. 29.1: «Corresponde a cada trabajador velar, según sus posibilidades y mediante el cumplimiento de las medidas de prevención que en cada caso sean adoptadas, por su propia seguridad y salud en el trabajo y por la de aquellas otras personas a las que pueda afectar su actividad profesional, a causa de sus actos y omisiones en el trabajo, de conformidad con su formación y las instrucciones del empresario.»")+NOTE("En tu puesto, «otras personas a las que pueda afectar tu actividad» son también las usuarias: por eso la evaluación te pide explicarles las pautas de uso seguro de los equipos y supervisar su cumplimiento.")],
["2. Las seis obligaciones (art. 29.2) aplicadas a tu puesto",T(["Obligación (texto legal resumido)","Ejemplo en Nesta Studios (de la evaluación)"],[["1.º Usar adecuadamente máquinas, aparatos, herramientas, sustancias peligrosas, equipos de transporte y cualquier otro medio","Usar el Reformer-Cadillac, el remo, la AirBike y el material solo para su finalidad y según el fabricante, sin modificaciones improvisadas."],["2.º Utilizar correctamente los medios y equipos de protección facilitados por el empresario","Calzado antideslizante (UNE-EN ISO 20347) y guantes según la ficha de seguridad (UNE-EN 374)."],["3.º No poner fuera de funcionamiento y utilizar correctamente los dispositivos de seguridad","Conservar resguardos y protecciones de las máquinas; no anular la toma de tierra; usar la cincha de seguridad de la barra del Cadillac."],["4.º Informar de inmediato a su superior y a los trabajadores designados o al servicio de prevención de cualquier situación que entrañe un riesgo","Comunicar material con rebabas, cables dañados, anclajes con holguras, obstáculos en vías de evacuación."],["5.º Contribuir al cumplimiento de las obligaciones establecidas por la autoridad competente","Respetar la prohibición de fumar, la señalización y las revisiones."],["6.º Cooperar con el empresario para que pueda garantizar unas condiciones de trabajo seguras","Colaborar en los simulacros y en la evaluación psicosocial."]])],
["3. Consecuencias del incumplimiento",LEY("Art. 29.3: el incumplimiento por los trabajadores de las obligaciones en materia de prevención de riesgos tendrá la consideración de incumplimiento laboral a los efectos previstos en el artículo 58.1 del Estatuto de los Trabajadores.")],
["4. Casos prácticos",CASO("La AirBike sin protección","Al preparar la sala ves que a la AirBike le falta un resguardo de la transmisión. Una compañera dice: «Funciona igual, úsala con cuidado».","La evaluación indica retirar del uso cualquier equipo con protecciones ausentes o deterioradas y comunicar la incidencia. El art. 29.2 obliga a no poner fuera de funcionamiento los dispositivos de seguridad y a informar de inmediato de las situaciones de riesgo.")+CASO("Sin calzado antideslizante","Un técnico decide dar las clases descalzo «porque es más cómodo» aunque la empresa facilita calzado antideslizante.","El calzado de trabajo antideslizante (UNE-EN ISO 20347) es el EPI indicado en la evaluación frente a caídas al mismo nivel. Utilizar correctamente los equipos de protección facilitados es una obligación del art. 29.2.2.º.")]],
key:"Velas por tu seguridad y la de quienes pueden verse afectados por tu trabajo (incluidas las usuarias): usa bien equipos y EPI, no anules protecciones, informa de inmediato y coopera.",
q:[["El art. 29 establece:",["Las obligaciones del empresario","Las obligaciones de los trabajadores en prevención","Las funciones de la Inspección","Las sanciones penales"],1],
["Ante un mosquetón del Reformer con el cierre defectuoso, debes:",["Seguir usándolo","Retirarlo del uso y comunicarlo de inmediato","Repararlo con cinta","Esperar a la revisión anual"],1],
["Anular la toma de tierra de un equipo de música es:",["Aceptable si funciona","Contrario a la obligación de no poner fuera de funcionamiento los dispositivos de seguridad","Recomendable","Obligatorio"],1],
["El incumplimiento de las obligaciones del art. 29 se considera:",["Un delito automáticamente","Incumplimiento laboral (art. 58.1 ET)","Nada","Infracción de tráfico"],1],
["El art. 29 incluye velar por la seguridad de:",["Solo uno mismo","Uno mismo y otras personas afectadas por su actividad","Solo los compañeros","Solo la empresa"],1],
["¿Qué EPI indica la evaluación frente a caídas al mismo nivel?",["Casco","Calzado de trabajo antideslizante (UNE-EN ISO 20347)","Arnés","Tapones"],1]]},
{t:"Cómo se ha evaluado tu puesto",ico:"📊",min:12,src:ER+" (apartados 1 a 3)",
obj:["Conocer la descripción y las tareas del puesto evaluado.","Interpretar la matriz probabilidad × consecuencia.","Leer el resumen de riesgos del puesto y su prioridad."],
b:[["1. Datos de la evaluación",T(["Dato","Valor"],[["Empresa","Nesta Entrenament i Salut, S.L. (Nesta Studios), centro de entrenamiento y Pilates, Barcelona"],["Centro","Centro de entrenamiento, 140 m²: 2 salas de entrenamiento, recepción, consulta, vestuarios y lavabos"],["Tipo","Evaluación inicial (art. 16 Ley 31/1995), visita del 22/10/2026"],["Realizada por","PREVIJOB, S.L. (técnico superior en PRL)"],["Puesto","Técnico/a de actividades físicas y entrenamiento · CNO 3723 Instructores de actividades deportivas · Grupo N (no sensibles) · 4 trabajadoras"]])],
["2. Qué hace el puesto",`<p>Según la evaluación, el puesto comprende:</p>${UL(["<b>Sesiones:</b> planificación, dirección y supervisión de actividades para grupos reducidos y entrenamiento personal: fuerza, acondicionamiento, intensidad variable, movilidad y Pilates (Mat y Reformer-Cadillac). Explicar y demostrar ejercicios, supervisar y corregir técnica y postura.","<b>Preparación:</b> preparar espacios y colocar, ajustar y recoger equipos (muelles, correas, barras), con manipulación manual puntual de cargas.","<b>Material:</b> Reformer-Cadillac, colchonetas, pelotas, aros, mancuernas, kettlebells, barras, discos, bancos, balones medicinales, TRX, estructuras de fuerza ancladas a la pared, remo ergómetro (RowErg) y AirBike.","<b>Atención:</b> recepción y atención presencial de usuarias, acompañamiento de nuevas usuarias, consultas; comunicaciones puntuales por correo y WhatsApp.","<b>Planificación:</b> preparación de sesiones y programas, con ordenadores portátiles (de empresa o propios).","<b>Limpieza básica:</b> desinfección del material con los productos facilitados, aspirado puntual y, ocasionalmente, limpieza básica de instalaciones (sin limpieza especializada ni mantenimiento técnico).","Clases con música de ambiente; trabajo en bipedestación dinámica combinado con tareas sentadas; todo dentro del centro."])}`],
["3. El método: probabilidad × consecuencia",`<p>Cada riesgo se valora combinando la <b>probabilidad</b> (1 baja: raras veces; 2 media: algunas ocasiones; 3 alta: siempre o casi siempre) y la <b>consecuencia</b> (1 daños leves; 2 daños graves; 3 muy graves).</p>${T(["C \\ P","Baja (1)","Media (2)","Alta (3)"],[["Leve (1)",V("Trivial"),V("Tolerable"),V("Moderado")],["Grave (2)",V("Tolerable"),V("Moderado"),V("Importante")],["Muy grave (3)",V("Moderado"),V("Importante"),V("Intolerable")]])}${T(["Nivel","Qué implica según la evaluación"],[["Trivial (prioridad baja)","No se necesita mejorar la acción preventiva, pero hacen falta comprobaciones periódicas."],["Tolerable (prioridad media)","Esfuerzos para reducir el riesgo, sobre todo con severidad media; medidas en un periodo determinado; comprobaciones periódicas."],["Moderado (prioridad media-alta)","Esfuerzos para reducir el riesgo en un periodo determinado; con severidad alta, siempre que sea posible no comenzar el trabajo hasta reducirlo o aplicar medidas inmediatas."],["Importante (prioridad alta)","No comenzar el trabajo hasta reducir el riesgo; si ya se realiza, remediar en menos tiempo que los moderados."],["Intolerable (prioridad inmediata)","No comenzar ni continuar hasta reducirlo; si no es posible, prohibir el trabajo."]])}`],
["4. Resumen de riesgos de tu puesto",T(["Nº","Riesgo","P","C","Valoración"],[["020","Caída de personas al mismo nivel","1","2",V("Tolerable")],["040","Caída de objetos en manipulación","1","3",V("Moderado")],["050","Caída de objetos desprendidos","1","2",V("Tolerable")],["060","Pisadas sobre objetos","1","2",V("Tolerable")],["070","Choques contra elementos inmóviles","1","2",V("Tolerable")],["080","Choques contra objetos móviles","1","2",V("Tolerable")],["090","Golpes o cortes con objetos o herramientas","1","2",V("Tolerable")],["110","Atrapamientos por o entre objetos","1","2",V("Tolerable")],["120","Atrapamiento por vuelco de máquinas o equipos","1","2",V("Tolerable")],["150","Contactos eléctricos directos","1","2",V("Tolerable")],["151","Contactos eléctricos indirectos","1","2",V("Tolerable")],["161","Exposición a sustancias químicas por contacto","1","2",V("Tolerable")],["180","Incendio","1","2",V("Tolerable")],["190","Agresiones de seres vivos","1","2",V("Tolerable")],["210","Exposición a agentes biológicos","1","2",V("Tolerable")],["250","Iluminación","1","2",V("Tolerable")],["260","Carga física: postura","2","2",V("Moderado")],["262","Carga física: sobresfuerzos","2","2",V("Moderado")],["263","Carga física: manipulación manual de cargas","1","2",V("Tolerable")],["270","Psicosociales: fatiga","1","2",V("Tolerable")],["271","Psicosociales: estrés","1","2",V("Tolerable")],["272","Psicosociales: violencia de clientes o usuarios","1","2",V("Tolerable")],["273","Psicosociales: organización","1","2",V("Tolerable")],["274","Psicosociales: desgaste profesional","1","2",V("Tolerable")],["275","Acoso laboral, sexual o por razón de sexo","1","2",V("Tolerable")]])+NOTE("Los tres riesgos <b>Moderados</b> del puesto son: <b>040 caída de objetos en manipulación</b>, <b>260 postura</b> y <b>262 sobresfuerzos</b>. Además, la evaluación del lugar de trabajo y de los equipos añade otros riesgos (eléctricos moderados, incendio, confort térmico, desplome de estantería, caída a distinto nivel en el Cadillac, contactos térmicos, fatiga visual…) que verás en los módulos siguientes.")+`<p><b>EPI del puesto:</b> calzado de trabajo antideslizante (UNE-EN ISO 20347) y guantes según la ficha de seguridad de los productos químicos (UNE-EN 374-1/2/3).</p>`],
["5. La evaluación es un proceso vivo",`<p>La evaluación se basa en lo declarado por la empresa: cualquier variación en métodos, equipos o procesos implica revisarla. Deben comunicarse las condiciones nuevas no contempladas y, por escrito, cualquier modificación, en especial si afecta a menores, embarazadas o personas con discapacidad reconocida.</p>${CASO("Nueva actividad","El centro quiere empezar clases de ejercicios invertidos y en suspensión en el Cadillac.","La evaluación indica que los ejercicios elevados, de suspensión o invertidos, si se realizan, deben estar previstos para el equipo y contar con personal específicamente formado y asistencia. Un cambio en la actividad debe comunicarse para revisar la evaluación, y la formación debe adaptarse (art. 19).")}`]],
key:"Tu puesto tiene 25 riesgos evaluados: 3 son Moderados (caída de objetos en manipulación, postura y sobresfuerzos) y el resto Tolerables. Si cambian tareas o equipos, la evaluación y la formación deben revisarse.",
q:[["¿Qué riesgos del puesto están valorados como Moderados?",["Incendio y eléctrico","Caída de objetos en manipulación, postura y sobresfuerzos","Acoso y estrés","Iluminación y ruido"],1],
["Probabilidad media (2) y consecuencia grave (2) dan:",["Tolerable","Moderado","Importante","Trivial"],1],
["Probabilidad baja (1) y consecuencia muy grave (3) dan:",["Trivial","Tolerable","Moderado","Intolerable"],2],
["Un riesgo Intolerable implica:",["Comprobaciones periódicas","No comenzar ni continuar el trabajo hasta reducirlo","Nada","Prioridad baja"],1],
["¿Cuántas personas ocupan el puesto según la evaluación?",["2","4","10","1"],1],
["Si cambian los equipos o métodos de trabajo:",["La evaluación sigue valiendo siempre","Debe revisarse la evaluación","Solo se avisa a las usuarias","No pasa nada"],1],
["La evaluación del puesto se hizo según el:",["Art. 16 de la Ley 31/1995","Código Penal","RD 486/2010","Convenio de hostelería"],0]]}
]};

{t:"Caídas al mismo nivel y pisadas sobre objetos",ico:"🧘",min:11,src:ER+" · riesgos 020 y 060 (puesto, lugar de trabajo y equipos)",
obj:["Identificar las causas de tropiezos y resbalones en la sala.","Aplicar las medidas de orden y limpieza de la evaluación.","Usar correctamente el EPI asignado."],
b:[["1. Los riesgos",RK("020","Caída de personas al mismo nivel","Tolerable",[1,2])+RK("060","Pisadas sobre objetos","Tolerable",[1,2])+`<p>En el centro los provocan las pesas, discos, mancuernas, colchonetas, correas, cuerdas y muelles fuera de su sitio, los derrames, el sudor y restos de productos de limpieza, las colchonetas con pliegues o bordes levantados y una iluminación insuficiente.</p>`],
["2. Medidas preventivas del puesto",T(["Momento","Qué hacer (evaluación)"],[["Durante la sesión","Zonas de paso libres de pesas, discos, mancuernas, colchonetas, correas y otros materiales. Mantener el entorno del Reformer sin cuerdas, correas, muelles ni accesorios en las zonas de paso."],["Al terminar cada actividad","Recoger el material y colocarlo en los espacios habilitados, sin invadir zonas de circulación ni accesos a equipos; retirar residuos."],["Derrames y sudor","Limpiar con prontitud derrames y restos de sudor. Con el suelo mojado, <b>señalizar y delimitar</b> la zona hasta que esté seca."],["Pavimento y colchonetas","Revisar periódicamente; corregir irregularidades, piezas sueltas o bordes levantados; evitar colchonetas con pliegues."],["Iluminación","Mantenerla adecuada durante la preparación, realización y recogida, y en accesos y zonas de paso."],["Organización","Programación de limpieza y mantenimiento de pavimentos; espacio suficiente para circular y supervisar."]])],
["3. Lo que exige el lugar de trabajo",`<p>Para el conjunto del centro la evaluación añade: los suelos deben ser <b>fijos, estables, sin irregularidades ni pendientes peligrosas y no resbaladizos</b>, con material rugoso antideslizante cuando sea preciso y mantenimiento periódico; señalizar los suelos mojados y ordenar y eliminar los restos de materiales.</p><p>En el material de gimnasio: utilizar elementos diseñados para el ejercicio, sobre pavimentos firmes, nivelados y antideslizantes; comprobar la estabilidad y el encaje de los módulos de los <b>steps</b>; evitar apilamientos o elevaciones improvisadas y <b>no usar bancos ni cajones para alcanzar estanterías</b>.</p>`],
["4. EPI",`<div class="card key" style="margin:0">👟 <b>Calzado de trabajo antideslizante (UNE-EN ISO 20347)</b> es el EPI que la evaluación asigna frente a la caída de personas al mismo nivel.</div>`],
["5. Casos prácticos",CASO("Cambio rápido de clase","Entre dos sesiones de 50 minutos solo hay 5 minutos. Los discos y las cintas elásticas se quedan en el suelo «para la siguiente».","La evaluación pide recoger el material al finalizar cada actividad y dejar las zonas de paso libres. Si el tiempo no lo permite, es un problema de organización: el riesgo 270 pide contemplar dentro de la jornada las tareas de preparación y recogida y evitar clases consecutivas sin tiempo suficiente.")+CASO("Suelo recién fregado","Has limpiado una mancha de sudor junto al rack y la primera usuaria está a punto de entrar.","Señalizar y delimitar la zona mojada hasta que esté seca.")]],
key:"Material recogido en su sitio, suelo seco (o señalizado si está mojado), colchonetas sin pliegues, buena luz y calzado antideslizante.",
q:[["¿Qué EPI indica la evaluación frente a caídas al mismo nivel?",["Guantes","Calzado de trabajo antideslizante UNE-EN ISO 20347","Rodilleras","Ninguno"],1],
["Si el suelo está mojado tras limpiar, debes:",["Seguir la clase","Señalizar y delimitar la zona hasta que se seque","Echar una toalla","Avisar después"],1],
["¿Cuándo debe recogerse el material?",["Al final del día","Al finalizar cada actividad","Una vez por semana","Lo recoge la limpieza externa"],1],
["Una colchoneta con el borde levantado:",["No es un riesgo","Debe corregirse: provoca pisadas inseguras o tropiezos","Mejora el agarre","Solo afecta a usuarias"],1],
["Para alcanzar un objeto en una estantería alta:",["Subir a un cajón de salto","No usar bancos ni cajones como medio de acceso","Subir al banco","Trepar a la estantería"],1],
["Los suelos del local deben ser:",["Fijos, estables, sin irregularidades y no resbaladizos","Encerados y brillantes","Cubiertos de alfombras sueltas","Indiferente"],0]]},
{t:"Choques contra elementos inmóviles",ico:"🚧",min:8,src:ER+" · riesgo 070",
obj:["Reconocer los elementos fijos que pueden causar golpes.","Aplicar las medidas de distribución y protección."],
b:[["1. El riesgo",RK("070","Choques contra elementos inmóviles","Tolerable",[1,2])+`<p>Racks, bancos, soportes, barras del Cadillac, estructuras ancladas a la pared y material que sobresale hacia las zonas de paso. En el lugar de trabajo («orden, limpieza y mantenimiento») se valora como Trivial; en «espacios y lugares de trabajo», Tolerable.</p>`],
["2. Medidas",UL(["Mantener libres de obstáculos zonas de trabajo, pasos entre equipos y pasillos; que el almacenamiento de pesas, barras, bancos y material no invada estas superficies.","Colocar el material de forma que <b>no sobresalga</b> hacia las zonas de paso y disponer de espacio para desplazarse y supervisar.","<b>Proteger los extremos y partes salientes</b> de equipos, soportes y estructuras, y señalizar el riesgo cuando sea necesario (sin alterar el funcionamiento del equipo).","Reformer-Cadillac: distribuirlo para que sus barras y estructura no obstaculicen los recorridos; buena iluminación para ver los salientes; atención al incorporarse o desplazarse a su alrededor; conservar las protecciones acolchadas.","Material de gimnasio: que los extremos de bancos, racks, máquinas y soportes no invadan las zonas de circulación; atención a la posición de barras y accesorios al preparar y recoger."])],
["3. Espacio mínimo (lugar de trabajo)",T(["Dimensión mínima","Valor según la evaluación"],[["Altura suelo-techo","3 m (2,5 m en locales comerciales, de servicios, oficinas y despachos)"],["Superficie libre por trabajador","2 m²"],["Volumen no ocupado por trabajador","10 m³"]])+`<p>Las estancias que no puedan usarse deben tener el acceso impedido y, a ser posible, señalizada la prohibición de entrada.</p>`],
["4. Caso práctico",CASO("La barra en el pasillo","Una barra olímpica queda apoyada en el rack con un extremo sobresaliendo hacia el paso a vestuarios.","Recolocarla para que no sobresalga hacia la zona de paso. Si hay partes salientes inevitables de equipos o estructuras, protegerlas y señalizarlas.")]],
key:"Nada debe sobresalir hacia los pasos: distribuye equipos, protege salientes y conserva los acolchados.",
q:[["¿Qué hay que hacer con las partes salientes de estructuras?",["Ignorarlas","Protegerlas y señalizar el riesgo si es necesario","Pintarlas de negro","Quitarles los tornillos"],1],
["Superficie libre mínima por trabajador:",["1 m²","2 m²","5 m²","10 m²"],1],
["Las protecciones acolchadas del Cadillac:",["Se pueden quitar","Deben conservarse","Solo son estéticas","Se quitan para limpiar y no se reponen"],1],
["El almacenamiento de material:",["Puede invadir los pasillos si es temporal","No debe invadir las superficies de tránsito","Se hace en las salidas","Es indiferente"],1],
["Volumen no ocupado por trabajador:",["10 m³","2 m³","30 m³","No hay mínimo"],0]]},
{t:"Choques contra objetos móviles",ico:"🚣",min:9,src:ER+" · riesgo 080 (puesto, Reformer-Cadillac y material de gimnasio)",
obj:["Identificar las trayectorias peligrosas de carros, barras, pedales y agarres.","Aplicar la regla «detener antes de intervenir»."],
b:[["1. El riesgo",RK("080","Choques contra objetos móviles","Tolerable",[1,2])+`<p>Carro del Reformer, barras sometidas a tensión, pedales y agarres del remo, AirBike, barras y pesas, balones medicinales.</p>`],
["2. Medidas del puesto",UL(["Mantener <b>distancia de seguridad</b> con las partes móviles del Reformer-Cadillac, el remo y demás equipos, sin situarse en la trayectoria de carros, barras, pedales u otros elementos en movimiento.","Al supervisar o corregir, colocarse fuera del recorrido y <b>detener el movimiento antes de intervenir o ajustar</b>.","Distribuir equipos y organizar sesiones para que sus zonas de movimiento no interfieran con los pasos ni con otras actividades."])],
["3. Reformer-Cadillac",UL(["Mantenerse fuera de la trayectoria del carro, las barras y los accesorios sometidos a tensión.","Controlar el retorno de los elementos y <b>no soltar bruscamente</b> agarres o barras.","Detener el ejercicio antes de intervenir o corregir una configuración.","Utilizar y ajustar la <b>cincha de seguridad de la barra</b> conforme al manual, especialmente con muelles inferiores; no situarse en su trayectoria durante los ajustes."])],
["4. Material de gimnasio",UL(["Fuera de la trayectoria de barras, pesas, balones medicinales, pedales y agarres del remo.","Organizar sesiones evitando interferencias entre ejercicios y zonas de paso.","Antes de corregir o ajustar, detener el ejercicio y comprobar que los elementos móviles están parados.","<b>Lanzamientos de balones</b> solo en zonas y superficies adecuadas."])],
["5. Caso práctico",CASO("Corrección en marcha","Una usuaria hace remo y el técnico se agacha junto al asiento móvil para corregirle la posición de los pies mientras sigue remando.","Incorrecto: debe detenerse el ejercicio y comprobar que los elementos móviles están parados antes de corregir; el técnico debe colocarse fuera del recorrido.")+CASO("La barra con muelle inferior","Vas a cambiar la configuración de la barra roll-down con muelles inferiores.","Usar y ajustar la cincha de seguridad según el manual y no situarse en la trayectoria de la barra durante el ajuste.")]],
key:"Fuera de la trayectoria y, antes de tocar, parar: ningún ajuste ni corrección con el equipo en movimiento.",
q:[["Antes de corregir una postura en el remo:",["Basta con avisar","Detener el ejercicio y comprobar que los elementos móviles están parados","Corregir en marcha","Subir la resistencia"],1],
["La cincha de seguridad de la barra del Cadillac:",["Es opcional","Debe usarse y ajustarse según el manual, sobre todo con muelles inferiores","Se quita para más recorrido","Solo para usuarias nuevas"],1],
["Al soltar una barra con muelles:",["Soltarla de golpe","Controlar el retorno y no soltar bruscamente","Dejarla caer al suelo","Pedir a la usuaria que la suelte"],1],
["Los lanzamientos de balón medicinal:",["En cualquier sitio","Solo en zonas y superficies adecuadas","Contra los espejos","En la recepción"],1],
["Durante la supervisión el técnico debe situarse:",["En la trayectoria del carro","Fuera del recorrido de los elementos móviles","Encima del bastidor","Detrás del muelle"],1]]},
{t:"Caída de objetos en manipulación (riesgo Moderado)",ico:"🏋️",min:11,src:ER+" · riesgo 040 (puesto: Moderado; material de gimnasio: Tolerable)",
obj:["Comprender por qué es uno de los tres riesgos Moderados.","Aplicar la técnica de agarre y comprobación previa.","Saber qué hacer si un elemento está deteriorado."],
b:[["1. El riesgo",RK("040","Caída de objetos en manipulación","Moderado",[1,3])+ALERT("Probabilidad baja pero <b>consecuencia muy grave (3)</b>: una mancuerna, kettlebell o disco que cae sobre el pie o la mano puede producir lesiones serias. Por eso es Moderado: prioridad media-alta.")],
["2. Medidas del puesto",T(["Medida","Detalle"],[["Agarre previsto","Manipular pesas, mancuernas, kettlebells y discos por las asas, empuñaduras o zonas de agarre, con sujeción firme y cómoda con toda la mano."],["Manos y agarres secos","Libres de sudor, grasa o restos de productos de limpieza que favorezcan el deslizamiento."],["Comprobar antes","Que no haya rebabas, bordes cortantes, roturas ni empuñaduras deterioradas."],["Si hay defectos","Retirar el elemento del uso y comunicar la incidencia para su revisión o sustitución."]])],
["3. Medidas del material de gimnasio",UL(["Transportar cantidades manejables, sin comprometer la visibilidad ni la sujeción.","Depositar de manera controlada, <b>sin colocar manos o pies bajo las cargas</b>.","<b>No intentar detener con el cuerpo una pesa que cae</b> ni dejar caer material fuera de zonas preparadas.","Colocar pesas, discos y barras en soportes adecuados, respetando su capacidad y sin sobresalir hacia las zonas de paso.","Elementos más pesados en niveles bajos; evitar apilamientos inestables; comprobar la estabilidad de soportes y retenciones.","Bancos, cajones, racks y equipos cardiovasculares sobre superficies estables y niveladas; respetar cargas máximas y usar apoyos, bloqueos y anclajes del fabricante.","No usar equipos con balanceos, holguras o desplazamientos anormales, ni como anclaje de otros materiales sin autorización del fabricante."])],
["4. Secuencia segura",FLOW(["Mirar el estado","Secar manos y agarre","Agarrar por la empuñadura","Trasladar pocas unidades","Depositar controlado, sin dedos debajo"])],
["5. Casos prácticos",CASO("Kettlebell resbaladiza","Acabas de desinfectar las kettlebells con spray y vas a colocarlas en el soporte.","Primero dejar que se sequen: la evaluación pide manos y superficies de agarre secas y sin restos de productos de limpieza, y las superficies secas antes de usarlas.")+CASO("La mancuerna que se escapa","Durante una demostración una mancuerna se te escurre y tu reflejo es pararla con el pie.","No intentar detener con el cuerpo una pesa que cae; apartarse. El riesgo 262 añade evitar sujetar de forma brusca una carga que cae.")]],
key:"Agarre firme por la empuñadura, manos secas, revisa antes, deposita sin dedos debajo y nunca frenes con el cuerpo una pesa que cae.",
q:[["¿Por qué el riesgo 040 es Moderado?",["Porque ocurre siempre","Porque la consecuencia puede ser muy grave (C=3)","Porque es trivial","Por el ruido"],1],
["Si una mancuerna tiene la empuñadura rota:",["Usarla con cuidado","Retirarla del uso y comunicarlo","Envolverla con cinta","Dársela a una usuaria"],1],
["Una pesa se cae durante una demostración:",["Pararla con el pie","No intentar detenerla con el cuerpo","Sujetarla bruscamente","Golpearla"],1],
["Para manipular un disco:",["Por cualquier borde","Con las manos secas y por la zona de agarre","Con las manos con crema","Con un solo dedo"],1],
["Los elementos más pesados se almacenan:",["Arriba","En niveles bajos","En el pasillo","Apilados en torre"],1],
["Al depositar material:",["Dejarlo caer","De forma controlada, sin manos ni pies debajo","Lanzarlo al soporte","Con prisa"],1]]},
{t:"Objetos desprendidos, desplome y anclajes (TRX, estantería, estructuras)",ico:"🧗",min:10,src:ER+" · riesgos 050 y 030 (puesto, lugar de trabajo, material, Cadillac)",
obj:["Almacenar el material de forma estable.","Conocer la medida correctora sobre la estantería de la sala de Pilates.","Revisar anclajes de TRX y estructuras de pared."],
b:[["1. Los riesgos",RK("050","Caída de objetos desprendidos","Tolerable",[1,2])+RK("030","Caída de objetos por desplome o derrumbamiento (lugar y Cadillac)","Tolerable",[1,2])],
["2. Almacenamiento estable (puesto)",UL(["Colocar pesas, mancuernas, discos, barras y material de forma estable en soportes y espacios habilitados, respetando su capacidad y evitando apilamientos.","Elementos más pesados en niveles inferiores; no almacenar en altura sin sujeción adecuada.","Comprobar que quedan apoyados o retenidos <b>antes de soltarlos</b>."])],
["3. Medida correctora: estantería de la sala de Pilates",ALERT("<b>Medida correctora de la evaluación:</b> fijar la estantería de la sala de Pilates a un paramento resistente mediante anclajes adecuados a sus características y a las indicaciones del fabricante, para evitar su vuelco. Comprobar su estabilidad y colocar los materiales más pesados en los niveles inferiores, respetando la capacidad de carga.")+UL(["Comprobar periódicamente la estabilidad y los anclajes; comunicar holguras o deterioros.","No trepar ni apoyarse en la estantería para alcanzar materiales.","Comprobar periódicamente estanterías, armarios, espejos, soportes y equipos que puedan caer o volcar.","Ante holguras o falta de sujeción: impedir su uso y <b>delimitar la zona</b> hasta corregir."])],
["4. TRX y estructuras ancladas a la pared",UL(["Instalarlos sobre soportes resistentes y compatibles con los esfuerzos, siguiendo al fabricante.","Revisar anclajes, correas, costuras, hebillas y conectores.","<b>No fijarlos a mobiliario, tuberías u otros elementos no previstos</b>.","Retirar del servicio los componentes deteriorados y mantener un <b>registro de revisiones</b>."])],
["5. Reformer-Cadillac: cambios de configuración",UL(["Sujetar barras y accesorios antes de liberar sus mecanismos de regulación.","Comprobar que pasadores, cierres y bloqueos quedan completamente acoplados antes de soltar o iniciar el ejercicio.","Cambios de configuración sin personas debajo de las piezas manipuladas; guardar accesorios sobre apoyos estables.","Equipo sobre pavimento firme y nivelado, según instrucciones de montaje y fijación; revisar apoyos, uniones, tornillería.","Respetar límites de carga y configuraciones autorizadas, sin anclajes o accesorios improvisados; suspender el uso ante holguras, fisuras, desplazamientos o deformaciones."])],
["6. Caso práctico",CASO("TRX en la tubería","Para una clase en la segunda sala alguien propone colgar el TRX de la tubería del techo.","Prohibido por la evaluación: no fijar el TRX a mobiliario, tuberías u otros elementos no previstos; debe instalarse sobre soportes resistentes según el fabricante.")]],
key:"Lo pesado abajo, nada en altura sin sujeción, estantería de Pilates anclada a la pared y TRX solo en anclajes previstos y revisados.",
q:[["¿Qué medida correctora se indica para la estantería de la sala de Pilates?",["Pintarla","Fijarla a un paramento resistente con anclajes adecuados","Moverla al pasillo","Ninguna"],1],
["El TRX puede anclarse a:",["Una tubería","Soportes resistentes previstos según el fabricante","Una puerta","Un banco"],1],
["Ante una estantería con holguras:",["Seguir usándola","Impedir su uso y delimitar la zona hasta corregir","Poner más peso abajo y seguir","Apoyarse para comprobar"],1],
["Antes de soltar una barra regulable del Cadillac:",["Nada","Comprobar que pasadores y bloqueos están completamente acoplados","Pedir a la usuaria que la suelte","Soltar y ver"],1],
["En el TRX hay que revisar:",["Solo el color","Anclajes, correas, costuras, hebillas y conectores","Nada","Solo el logotipo"],1],
["Para alcanzar material de la estantería:",["Trepar","No trepar ni apoyarse en ella","Subir a un step","Tirar del estante"],1]]},
{t:"Iluminación, espejos y condiciones ambientales",ico:"💡",min:8,src:ER+" · riesgo 250 (puesto y lugar), 132 confort térmico, 300 ventilación",
obj:["Aplicar las medidas de iluminación de la sala durante las clases.","Conocer los rangos de temperatura y la ventilación indicados."],
b:[["1. Iluminación",RK("250","Iluminación","Tolerable",[1,2])+UL(["Mantenimiento periódico: limpiar luminarias y sustituir lámparas deterioradas, agotadas u obsoletas.","Que permita observar y corregir ejercicios, ajustar equipos y manipular material con seguridad.","Evitar <b>deslumbramientos, reflejos en espejos y pantallas, parpadeos y sombras</b>.","La iluminación ambiental de las clases no debe reducir la visibilidad de obstáculos, desniveles o partes móviles.","Distribución uniforme, sin contrastes bruscos; evitar <b>luces intermitentes, parpadeos y efectos estroboscópicos</b>.","Zonas de exigencias visuales altas: mínimo <b>500 lux</b> (lugar de trabajo).","Comunicar deficiencias para su reparación por personal autorizado."])],
["2. Confort térmico y ventilación",RK("132","Confort térmico","Tolerable",[1,2])+T(["Tipo de trabajo","Temperatura según la evaluación"],[["Sedentario","17 °C – 27 °C"],["Ligero","14 °C – 25 °C"]])+UL(["Regular con calefacción y aire acondicionado y ajustar según la actividad de cada área.","Ventilación efectiva, aportando aire fresco sin corrientes; humedad relativa adecuada.","Entradas y salidas de aire libres de obstáculos; mantenimiento periódico de climatización y ventilación."])],
["3. Climatización (riesgo biológico trivial)",UL(["Limpieza de filtros como mínimo dos veces al año (primavera y otoño).","Limpieza de rejillas y bandejas de condensación.","Se recomienda limpiar conductos cada 6 o 7 años (O.I.T.)."])],
["4. Caso práctico",CASO("Clase con luces de discoteca","Para una sesión de intensidad variable se propone bajar las luces y poner luces estroboscópicas.","La evaluación indica evitar luces intermitentes, parpadeos y efectos estroboscópicos que dificulten percibir el movimiento, y que la iluminación de las clases no reduzca la visibilidad de obstáculos o partes móviles.")]],
key:"Luz uniforme y suficiente, sin reflejos en los espejos ni efectos estroboscópicos; temperatura y ventilación adecuadas a la actividad.",
q:[["Las luces estroboscópicas durante las clases:",["Recomendadas","Deben evitarse","Obligatorias","Solo en Pilates"],1],
["Nivel mínimo en zonas de exigencias visuales altas:",["100 lux","500 lux","50 lux","2000 lux"],1],

["Filtros de climatización: limpieza mínima",["Cada 10 años","Dos veces al año (primavera y otoño)","Nunca","Cada día"],1],
["Ante una lámpara que parpadea:",["Ignorarlo","Comunicarlo para su reparación por personal autorizado","Desmontarla tú","Apagar todas"],1]]}
