<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Panel de administración · Curso PRL Técnico/a de actividades físicas y entrenamiento</title>
<style>
:root{--pri:#0277ab;--acc:#16B14C;--ko:#c62828;--mut:#5b6b78;--bg:#f3f7fa;--card:#fff;--bd:#d6e2ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1d2b36}
header{background:linear-gradient(120deg,#06476b,#0277ab);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:38px;background:#fff;border-radius:8px;padding:3px 6px}header h1{font-size:1.1rem;margin:0;flex:1}
main{max-width:1300px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0b3a5510}
button,.b{font:inherit;border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
.btn{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}.del{color:var(--ko)}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;min-width:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tools input{flex:1;min-width:200px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kpi div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px}.kpi b{font-size:1.5rem;display:block;color:#06476b}.kpi span{color:var(--mut);font-size:.85rem}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid var(--bd);padding:8px;text-align:left;vertical-align:middle;white-space:nowrap}th{background:#e8f1f7;position:sticky;top:0;cursor:pointer}
.bar{width:90px;height:8px;background:#e3ebf0;border-radius:9px;display:inline-block;vertical-align:middle;margin-right:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.ok{background:#e3f6ea;color:#0f7a35;font-weight:800;border-radius:7px;padding:2px 8px}.no{background:#fde8e8;color:var(--ko);font-weight:800;border-radius:7px;padding:2px 8px}
.err{color:var(--ko);font-weight:600}.mut{color:var(--mut)}
#login{max-width:420px;margin:40px auto}#login label{display:block;margin:10px 0}#login input{width:100%}
@media print{header,.noprint{display:none!important}body{background:#fff}main{padding:0}}
[hidden]{display:none!important}
</style></head><body>
<header class="noprint"><img src="__LOGO__" alt="PREVIJOB"><h1>Panel de administración · Curso PRL Técnico/a de actividades físicas y entrenamiento</h1><button id="out" hidden>🚪 Salir</button></header>
<main>
<form id="login" class="card" hidden><h2>🔐 Acceso de administración</h2><p class="mut">Introduce la contraseña de administración.</p><label>Contraseña<input id="pw" type="password" autocomplete="current-password" required></label><p class="err" id="lerr" role="alert"></p><button class="btn" type="submit">Entrar</button></form>
<section id="panel" hidden>
<div class="kpi" id="kpi"></div>
<div class="card tools noprint"><input id="q" type="search" placeholder="🔎 Buscar por nombre, DNI/NIE o correo"><select id="emp"><option value="">Todas las empresas</option></select><select id="res"><option value="">APTO y NO APTO</option><option value="1">Solo APTO</option><option value="0">Solo NO APTO</option></select><button id="csv">⬇️ CSV / Excel</button><button id="rf">🔄 Actualizar</button></div>
<div class="card"><div class="tw"><table><thead><tr><th data-s="name">Nombre</th><th data-s="dni">DNI/NIE</th><th data-s="company">Empresa</th><th data-s="pct">Progreso</th><th>Tests módulo (/15)</th><th data-s="examOk">Examen</th><th data-s="passed">Resultado</th><th data-s="passedAt">Fecha</th><th class="noprint">Acciones</th></tr></thead><tbody id="tb"></tbody></table></div><p class="mut" id="cnt"></p></div>
</section>
</main>
<script>
const META=__META__;
const API=location.hostname==="curso-prl-tecnico-actividad-fisica.onrender.com"?"https://curso-prl-taf-api.onrender.com":"";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TOK=sessionStorage.getItem("prl-taf-admin")||"",W=[],sortK="company",sortD=1;
const hm=t=>(t>=60?Math.floor(t/60)+" h ":"")+(t%60?t%60+" min":"");
const fd=d=>d?d.split("-").reverse().join("/"):"—";
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{"Content-Type":"application/json",...(TOK?{Authorization:"Bearer "+TOK}:{}),...(o.headers||{})}});if(r.status===401&&p!=="/api/admin/login"){logout();throw new Error("Sesión caducada")}return r}
function logout(){TOK="";sessionStorage.removeItem("prl-taf-admin");$("#panel").hidden=true;$("#out").hidden=true;$("#login").hidden=false}
$("#out").onclick=logout;
$("#login").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="Comprobando… (si el servidor estaba en reposo puede tardar hasta 1 minuto)";try{const r=await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})}),j=await r.json();if(!r.ok){$("#lerr").textContent=j.error||"Error";return}TOK=j.token;sessionStorage.setItem("prl-taf-admin",TOK);$("#pw").value="";$("#lerr").textContent="";show()}catch(x){$("#lerr").textContent="No se pudo conectar con el servidor."}};
async function show(){$("#login").hidden=true;$("#panel").hidden=false;$("#out").hidden=false;await load()}
async function load(){$("#cnt").textContent="Cargando…";const r=await api("/api/admin/workers"),j=await r.json();W=j.workers;const es=[...new Set(W.map(w=>w.company))].sort((a,b)=>a.localeCompare(b,"es")),cur=$("#emp").value;$("#emp").innerHTML=`<option value="">Todas las empresas (${es.length})</option>`+es.map(e=>`<option ${e===cur?"selected":""}>${esc(e)}</option>`).join("");render()}
function filtered(){const q=$("#q").value.trim().toLowerCase(),e=$("#emp").value,rs=$("#res").value;return W.filter(w=>(!e||w.company===e)&&(rs===""||String(+w.passed)===rs)&&(!q||(w.name+" "+w.dni+" "+w.email+" "+w.company).toLowerCase().includes(q))).sort((a,b)=>{const x=a[sortK]??"",y=b[sortK]??"";return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"es"))*sortD})}
function render(){const L=filtered(),ap=L.filter(w=>w.passed).length,avg=L.length?Math.round(L.reduce((a,w)=>a+w.pct,0)/L.length):0;
$("#kpi").innerHTML=`<div><b>${L.length}</b><span>personas (filtro actual)</span></div><div><b>${ap}</b><span>APTO</span></div><div><b>${L.length-ap}</b><span>NO APTO / pendientes</span></div><div><b>${avg}%</b><span>progreso medio</span></div>`;
$("#tb").innerHTML=L.map(w=>`<tr><td><b>${esc(w.name)}</b><br><small class="mut">${esc(w.email)}</small></td><td>${esc(w.dni)}</td><td>${esc(w.company)}</td><td><span class="bar"><i style="width:${w.pct}%"></i></span>${w.pct}%</td><td><small>${w.modules.map((m,i)=>`M${i+1}: ${m.final??"–"}`).join(" · ")}</small></td><td>${w.examOk!=null?w.examOk+"/"+w.examN:"—"}</td><td>${w.passed?'<span class="ok">APTO</span>':'<span class="no">NO APTO</span>'}</td><td>${fd(w.passedAt)}</td><td class="noprint"><button class="del" data-d="${esc(w.dni)}">🗑️ Eliminar</button></td></tr>`).join("")||`<tr><td colspan="9" class="mut">Sin resultados.</td></tr>`;
$("#cnt").textContent=`${L.length} de ${W.length} personas dadas de alta.`;
$("#tb").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const w=W.find(x=>x.dni===b.dataset.d);if(!confirm(`¿Eliminar definitivamente a ${w.name} (${w.dni}) y todo su progreso?`))return;const r=await api("/api/admin/workers/"+encodeURIComponent(w.dni),{method:"DELETE"});if(r.ok)load();else alert("No se pudo eliminar.")})}
["q","emp","res"].forEach(i=>$("#"+i).oninput=render);$("#rf").onclick=load;
document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{const k=th.dataset.s;sortD=sortK===k?-sortD:1;sortK=k;render()});
$("#csv").onclick=async()=>{const p=new URLSearchParams({q:$("#q").value.trim(),empresa:$("#emp").value}),r=await api("/api/admin/export.csv?"+p);if(!r.ok)return alert("No se pudo exportar.");const b=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(r.headers.get("Content-Disposition")||"").match(/filename="([^"]+)"/)?.[1]||"trabajadores.csv";document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
if(TOK)show().catch(logout);else logout();
</script></body></html>
