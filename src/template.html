<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso PRL · Técnico/a de actividades físicas y entrenamiento</title>
<meta name="description" content="Formación PRL (art. 19 Ley 31/1995) para el puesto de Técnico/a de actividades físicas y entrenamiento, basada en la evaluación de riesgos.">
<style>
html{--bg:#eef5f9;--card:#fff;--txt:#1d2b36;--mut:#4a5a68;--pri:#0277ab;--pri2:#009CD7;--acc:#128a3c;--acc2:#16B14C;--bd:#d6e4ec;--ok:#15803d;--ko:#c62828;--amb:#a15c00;--navy:#06476b;--navy2:#0277ab;--btnTxt:#fff;--tagTxt:#035f8c}
html[data-theme=dark]{--bg:#06131c;--card:#0d2130;--txt:#e8f0f6;--mut:#a9bccb;--pri:#4cc0f0;--pri2:#38b6ec;--acc:#3ddc84;--acc2:#3ddc84;--bd:#24445a;--ok:#22c55e;--ko:#ff6b6b;--amb:#fbbf24;--navy:#041e2e;--navy2:#06476b;--btnTxt:#04121d;--tagTxt:#9fdcf7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;
background-image:radial-gradient(1100px 600px at 100% -10%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
a{color:var(--pri)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--acc2);box-shadow:0 4px 18px #0003}
header h1{font-size:1rem;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
header h1 span{overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff1a;border:1px solid #ffffff40;color:#fff}
.logo-h{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:block;flex:none}
.prog{flex:2;max-width:320px;height:8px;background:#ffffff30;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#009CD7,#16B14C);transition:width .5s}
#pct{font-size:.85rem}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:9999px;padding:7px 14px;transition:transform .15s,background .2s}button:hover{transform:translateY(-1px)}
.btn{background:var(--pri);color:var(--btnTxt);border:none;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}
.wrap{display:flex;max-width:1240px;margin:auto}
nav{width:290px;flex:none;padding:16px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;background:color-mix(in srgb,var(--card) 70%,transparent)}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--txt);text-decoration:none;margin-bottom:2px;cursor:pointer;font-size:.88rem}
nav a:hover{background:color-mix(in srgb,var(--pri) 10%,transparent)}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:var(--btnTxt)}nav a .ck{margin-left:auto}
nav details.ng{background:none;border:none;margin:6px 0}nav details.ng summary{padding:8px 10px;font-size:.92rem}nav details.ng summary small{color:var(--mut);font-weight:400}
main{flex:1;padding:22px;min-width:0}
.view{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{letter-spacing:-.01em;line-height:1.25}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px #0000000d,0 8px 24px #0a1f330d}
.lc{cursor:pointer;transition:transform .2s,box-shadow .2s}.lc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #00000022}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pri2) 14%,var(--card));color:var(--tagTxt);border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
.tag.t2{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
details.bl{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
details.bl summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}details.bl summary::-webkit-details-marker{display:none}
details.bl summary::after{content:"＋";float:right;color:var(--pri)}details.bl[open] summary::after{content:"－"}
details.bl>div{padding:0 16px 14px}
.key{border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.note{border-left:5px solid var(--pri2);background:color-mix(in srgb,var(--pri2) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.alert{border-left:5px solid var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.caso{border:2px dashed color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 6%,var(--card));padding:12px 14px;border-radius:12px;margin:12px 0}
.caso>b:first-child{color:var(--pri)}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.sem>div{border-radius:12px;padding:12px;border:2px solid}
.sv{border-color:#16B14C!important;background:color-mix(in srgb,#16B14C 10%,var(--card))}.sa{border-color:#f59e0b!important;background:color-mix(in srgb,#f59e0b 12%,var(--card))}.sr{border-color:#e53935!important;background:color-mix(in srgb,#e53935 10%,var(--card))}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.flow span{background:color-mix(in srgb,var(--pri) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 40%,transparent);border-radius:10px;padding:6px 10px;font-size:.88rem}.flow i{font-style:normal;color:var(--pri);font-weight:800}
.q{margin:16px 0}.q p{font-weight:700;margin:.2em 0 .5em}.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt:disabled{cursor:default;transform:none;opacity:1}
html[data-theme=dark] .opt.ok,html[data-theme=dark] .opt.ko{color:#04121d}
.fb{font-size:.9rem;min-height:1.2em;font-weight:600}.score{font-size:1.15rem;font-weight:800}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
figure{margin:12px 0;text-align:center}figure img{max-width:100%;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;background:#fff}figcaption{font-size:.8rem;color:var(--mut)}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fade .25s}.lb img{max-width:96vw;max-height:92vh;border-radius:8px;background:#fff}.lb button{position:fixed;top:12px;right:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:.88rem;margin:4px 0 8px}
.hx{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:40px 34px;background:linear-gradient(135deg,var(--navy) 0%,#035f8c 55%,#0291CE 100%);box-shadow:0 20px 50px #0a1f3355;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#009CD7 0 50%,#16B14C 50% 100%)}
.hx>*{position:relative;min-width:0}
.logo-x{height:54px;background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:14px;box-shadow:0 6px 18px #0003;max-width:100%}
.eyb{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9ff0bb}
.eyb::before{content:"";width:26px;height:2px;background:#16B14C}
.hx h2{font-size:clamp(1.7rem,4.4vw,3.1rem);line-height:1.07;margin:.35em 0 .3em;font-weight:800}
.hx h2 em{font-style:normal;color:#9ff0bb}
.hx p.sub{font-size:1.04rem;color:#e1eef7;max-width:580px;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:#0f7a35;color:#fff;border:none;font-weight:800;padding:13px 26px;font-size:1.02rem;box-shadow:0 8px 24px #16b14c55}
.go2{background:transparent;color:#fff;border:1px solid #ffffff66;padding:12px 18px}
.pbar{margin-top:18px;max-width:420px}.pbar small{color:#d3e4f0}.pbar div{height:8px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.rack{width:100%;max-width:400px;justify-self:center}
.rack .box{animation:drop 5s ease-in-out infinite;transform-box:fill-box}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}15%,85%{transform:none;opacity:1}100%{transform:none;opacity:1}}
.rack .fork{animation:fork 5s ease-in-out infinite}@keyframes fork{0%,100%{transform:translate(0,0)}40%{transform:translate(0,-62px)}60%{transform:translate(0,-62px)}}
.rack .lamp{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.rack .scan{animation:scan 3.5s linear infinite}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;border-top:3px solid var(--acc2)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;color:var(--pri)}.stat span{font-size:.85rem;color:var(--mut)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.mc .n{font-size:2.6rem;font-weight:800;color:color-mix(in srgb,var(--pri2) 25%,transparent);position:absolute;right:14px;top:4px}
.mc h3{margin:.4em 0 .2em;font-size:1.02rem}.mc p{margin:0;color:var(--mut);font-size:.88rem}
.mp{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.mp i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.sech::after{content:"";flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.grid .card{margin:0}.grid h4{margin:.4em 0}
.hero{background:linear-gradient(135deg,var(--navy),#035f8c 60%,#0291CE);color:#fff;border-radius:18px;padding:26px}
.hero h2{margin:.2em 0}
.gym{width:100%;max-width:400px;justify-self:center}
.gym .bar{animation:lift 2.6s ease-in-out infinite}@keyframes lift{0%,100%{transform:translateY(160px)}45%,60%{transform:translateY(96px)}}
.gym .arm1{animation:a1 2.6s ease-in-out infinite;transform-origin:115px 150px}.gym .arm2{animation:a2 2.6s ease-in-out infinite;transform-origin:155px 150px}
@keyframes a1{0%,100%{transform:rotate(-60deg)}45%,60%{transform:rotate(0)}}@keyframes a2{0%,100%{transform:rotate(60deg)}45%,60%{transform:rotate(0)}}
.gym .kb{animation:sw 3s ease-in-out infinite;transform-origin:258px 240px}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.gym .pulse{stroke-dasharray:240;animation:pl 2s linear infinite}@keyframes pl{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
.vb{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:1px 10px;border:1px solid;white-space:nowrap}
.v-trivial{background:#e6f4ea;color:#14532d;border-color:#15803d}.v-tolerable{background:#e0f2fe;color:#0c4a6e;border-color:#0369a1}.v-moderado{background:#fef3c7;color:#713f12;border-color:#a16207}.v-importante{background:#ffedd5;color:#7c2d12;border-color:#c2410c}.v-intolerable{background:#fee2e2;color:#7f1d1d;border-color:#b91c1c}
.rk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--pri) 5%,var(--card))}.rk small{color:var(--mut)}
.rc{font-weight:800;font-size:.8rem;background:var(--pri);color:var(--btnTxt);border-radius:8px;padding:1px 8px}
.ley{border-left:5px solid #7c3aed;background:color-mix(in srgb,#7c3aed 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
html[data-theme=dark] .ley{border-color:#c4b5fd}
.cert{background:#fff;color:#1d2b36;border:3px double #0277ab;border-radius:16px;padding:28px;text-align:center;margin:14px 0}.cert h2{color:#06476b}.cert .cn{font-size:1.6rem;font-weight:800;border-bottom:2px solid #16B14C;display:inline-block;min-width:60%;padding:0 10px}.cert th{background:#e0eef6;color:#1d2b36}.cert td,.cert th{border-color:#b9cfdc}.cert p[style]{color:#4a5a68!important}
.firmas{display:flex;justify-content:space-around;gap:20px;margin-top:50px;flex-wrap:wrap}.firmas div{border-top:1px solid #4a5a68;padding-top:6px;min-width:200px;font-size:.85rem}
button:disabled{opacity:.55;cursor:not-allowed}
.ub{max-width:200px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.ub span{overflow:hidden;text-overflow:ellipsis}
body.noauth nav,body.noauth .prog,body.noauth #pct{display:none}
.auth{max-width:760px;margin:auto}.ah{grid-template-columns:1.3fr 1fr}.ah .gym{max-width:260px}
.tabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.af label{display:block;font-weight:700;margin:10px 0;font-size:.92rem}.af input:not([type=checkbox]),.af select{display:block;width:100%;font:inherit;font-weight:400;padding:10px 12px;margin-top:4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.af input:focus,.af select:focus{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent)}
.af .chk{display:flex;gap:8px;align-items:flex-start;font-weight:600}.af .chk input{width:20px;height:20px;flex:none;margin-top:2px}
.rgpd{font-size:.82rem}.err{color:var(--ko);font-weight:700;min-height:1.2em}
.sw{text-align:left}
[hidden]{display:none!important}#menu{display:none}
ul,ol{padding-left:1.3em}li{margin:3px 0}
@media(max-width:1000px){.mods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hx{grid-template-columns:1fr;padding:28px 20px 32px}.rack,.gym{max-width:260px;order:-1}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){nav{position:fixed;left:0;top:59px;background:var(--card);z-index:9;transform:translateX(-105%);transition:transform .3s;border-right:1px solid var(--bd);width:min(290px,86vw)}nav.open{transform:none}#menu{display:inline-block}.prog{display:none}}
@media(max-width:600px){main{padding:14px 12px}.mods{grid-template-columns:1fr}.sem{grid-template-columns:1fr}.logo-h{height:28px}.logo-x{height:44px}header{gap:8px;padding:10px}header h1{font-size:.88rem}.card{padding:14px}details.bl>div{padding:0 12px 12px}}
@media(max-width:420px){#pct{display:none}.ub{max-width:110px;padding:6px 10px}.ah{padding:22px 16px}header h1 span{max-width:40vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.pn,.noprint,.alert{display:none!important}.cert{border-color:#0277ab}main{padding:0}body{background:#fff;color:#000}.wrap{display:block}details.bl{break-inside:avoid}}
</style>
</head>
<body>
<header><button id="menu" aria-label="Abrir menú">☰</button><h1><img class="logo-h" src="__LOGO__" alt="PREVIJOB"><span>Curso PRL · Técnico/a de actividades físicas</span></h1><div class="prog" title="Progreso"><i id="bar"></i></div><span id="pct">0%</span><button id="ubtn" class="ub" hidden title="Mi cuenta">👤 <span id="uname"></span></button><button id="theme" aria-label="Cambiar tema claro/oscuro">🌙</button></header>
<div class="wrap"><nav id="nav" aria-label="Índice del curso"></nav><main id="main"></main></div>
<script>
const LOGO="__LOGO__";
const fig=k=>`<figure><img class="zoom" src="${IMG[k][0]}" alt="${IMG[k][1]}" loading="lazy"><figcaption>${IMG[k][1]} · toca para ampliar</figcaption></figure>`;
const T=(h,rows)=>`<div class="tbl"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const UL=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const OL=a=>`<ol>${a.map(x=>`<li>${x}</li>`).join("")}</ol>`;
const NOTE=s=>`<div class="note">${s}</div>`, ALERT=s=>`<div class="alert">⚠️ ${s}</div>`;
const CASO=(t,s,r)=>`<div class="caso"><b>🧩 Caso práctico: ${t}</b><p>${s}</p><details><summary><b>Ver resolución</b></summary><p>${r}</p></details></div>`;
const FLOW=a=>`<div class="flow">${a.map(x=>`<span>${x}</span>`).join("<i>→</i>")}</div>`;
__CONTENT__
__ENGINE__
</script>
</body>
</html>
